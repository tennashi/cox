# Rules for `cargo deny check`, which `cargo xtask ci` runs.

[advisories]
# Known vulnerabilities fail the check anywhere in the tree. Unmaintained
# crates fail only when the workspace depends on them directly: gpui pulls
# in a dozen unmaintained transitive crates (ttf-parser, rustybuzz, paste,
# async-std, ...) that only Zed can swap out.
unmaintained = "workspace"

[licenses]
# Licenses dependencies may use: any whose terms do not conflict with
# distributing Cox under MIT. Permissive licenses qualify; GPL-family
# licenses do not, because they would require Cox itself to be GPL.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # The root certificates the cef crate's build downloads CEF with.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # BSD-like; the bzip2 the cef crate's build unpacks CEF with.
    "bzip2-1.0.6",
]
# The list is a policy, not a record of current dependencies, so entries no
# dependency uses yet are expected.
unused-allowed-license = "allow"

[bans]
# Duplicate versions of a crate are allowed:
# gpui's tree carries about seventy of them, and only Zed can reduce that.
multiple-versions = "allow"
wildcards = "deny"

[sources]
# Dependencies come from crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
