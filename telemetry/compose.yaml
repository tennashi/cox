# Keeps what coxd measures of itself, and shows it: Prometheus, which
# takes coxd's OTLP itself, and Grafana, which draws it. Both listen on
# this machine only. See "Telemetry" in docs/configuration.md.
name: cox-telemetry

x-kept: &kept
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "2"

services:
  prometheus:
    <<: *kept
    image: prom/prometheus:v3.16.0
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
      # Without it a rate misses the first event of a series, which is
      # all a cold start of the page makes.
      - --enable-feature=created-timestamp-zero-ingestion
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - data:/prometheus

  grafana:
    <<: *kept
    image: grafana/grafana:13.3.2
    mem_limit: 512m
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/cox/dashboards/cox-phone.json
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/cox.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/cox.yaml:ro
      - ./grafana/dashboards:/etc/cox/dashboards:ro

volumes:
  data:
