[package]
name = "cox-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Listing a project's files as Git sees them: see
# `src/files.rs`.
ignore = "0.4.33"
# The text, as a rope: see `src/buffer.rs`. Only `\n` breaks lines, as in
# the files Cox edits; a `\r` before it stays out of the line.
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
# Talking to the language servers, in JSON-RPC, with the files' addresses
# as URLs: see `src/lsp.rs`.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { workspace = true, features = ["sync"] }
# What the language servers say, for the logs: see `src/lsp.rs`.
tracing.workspace = true
# The syntax of the text, to draw it in colors: see `src/syntax.rs`, and
# `src/language.rs` for the grammars.
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tempfile = "3.27.0"
