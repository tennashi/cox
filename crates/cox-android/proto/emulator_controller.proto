// The part of the Android emulator's gRPC service that Cox uses, cut from
// emulator_controller.proto in AOSP's platform/external/qemu
// (android/android-grpc/services/emulator-controller/proto), branch
// emu-master-dev. The methods, messages and field numbers are as there, so
// that a real emulator answers them; what Cox does not use is left out,
// and a field of a message left out is skipped as unknown.

syntax = "proto3";

package android.emulation.control;
import "google/protobuf/empty.proto";

service EmulatorController {
    // Sends a key to the emulator.
    rpc sendKey(KeyboardEvent) returns (google.protobuf.Empty) {}

    // Sends a touch to the emulator.
    rpc sendTouch(TouchEvent) returns (google.protobuf.Empty) {}

    // Turns the wheel of a mouse over the emulator.
    rpc injectWheel(stream WheelEvent) returns (google.protobuf.Empty) {}

    // A screenshot, scaled to fit the format's width and height, keeping
    // the display's aspect ratio; at the display's own size when they are
    // 0.
    rpc getScreenshot(ImageFormat) returns (Image) {}

    // A screenshot each time the display changes, as getScreenshot takes
    // them.
    rpc streamScreenshot(ImageFormat) returns (stream Image) {}

    // Sets the state of the virtual machine, as to shut it down.
    rpc setVmState(VmRunState) returns (google.protobuf.Empty) {}
}

message ImageFormat {
    enum ImgFormat {
        PNG = 0;
        // Four bytes a pixel: red, green, blue and alpha.
        RGBA8888 = 1;
        RGB888 = 2;
    }

    ImgFormat format = 1;
    // [Output Only] How the device is turned.
    Rotation rotation = 2;
    uint32 width = 3;
    uint32 height = 4;
    // The display, 0 being the main one.
    uint32 display = 5;
}

message Image {
    ImageFormat format = 1;
    uint32 width = 2 [deprecated = true];
    uint32 height = 3 [deprecated = true];
    bytes image = 4;
    // [Output Only] Rises with each screenshot of a stream, skipping those
    // dropped.
    uint32 seq = 5;
    // [Output Only] When the emulator made the frame, in microseconds of
    // Unix time.
    uint64 timestampUs = 6;
}

message Rotation {
    enum SkinRotation {
        PORTRAIT = 0;
        LANDSCAPE = 1;
        REVERSE_PORTRAIT = 2;
        REVERSE_LANDSCAPE = 3;
    }

    SkinRotation rotation = 1;
    double xAxis = 2;
    double yAxis = 3;
    double zAxis = 4;
}

message Touch {
    // Where on the display, in its own pixels from its top left corner.
    int32 x = 1;
    int32 y = 2;
    // Which finger, the same while it touches.
    int32 identifier = 3;
    // More than 0 while the finger touches, and 0 as it lifts.
    int32 pressure = 4;
    int32 touch_major = 5;
    int32 touch_minor = 6;

    enum EventExpiration {
        EVENT_EXPIRATION_UNSPECIFIED = 0;
        NEVER_EXPIRE = 1;
    }

    EventExpiration expiration = 7;
    int32 orientation = 8;
}

message TouchEvent {
    repeated Touch touches = 1;
    int32 display = 2;
}

message KeyboardEvent {
    enum KeyCodeType {
        Usb = 0;
        Evdev = 1;
        XKB = 2;
        Win = 3;
        Mac = 4;
    }

    enum KeyEventType {
        keydown = 0;
        keyup = 1;
        keypress = 2;
    }

    KeyCodeType codeType = 1;
    KeyEventType eventType = 2;
    int32 keyCode = 3;
    // The key, as the W3C names it: "Enter", "Backspace", "a", or one of
    // Android's, as "GoBack", "GoHome" and "AppSwitch".
    string key = 4;
    // Text to type, a character at a time.
    string text = 5;
}

message WheelEvent {
    // 120 for each click of the wheel.
    int32 dx = 1;
    int32 dy = 2;
    int32 display = 3;
}

message VmRunState {
    enum RunState {
        UNKNOWN = 0;
        RUNNING = 1;
        RESTORE_VM = 2;
        PAUSED = 3;
        SAVE_VM = 4;
        SHUTDOWN = 5;
        TERMINATE = 7;
        RESET = 9;
        INTERNAL_ERROR = 10;
        RESTART = 11;
        START = 12;
        STOP = 13;
    }

    RunState state = 1;
}
