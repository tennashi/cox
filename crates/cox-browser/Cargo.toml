[package]
name = "cox-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
# The flag that asks Cox to quit, which the app looks at: see `src/macos.rs`.
cox-core.workspace = true
# Cox runs on Linux and macOS: the browser is CEF, which on macOS lives in
# an app bundle that `cargo xtask bundle` assembles; see CONTRIBUTING.md.
cef = { version = "=152.3.0", default-features = false }
# cef accepts any 152.x of its sys crate, and the newest expects a newer
# CEF than the one these bindings were generated from; pin the pair that
# matches CEF 152.0.6.
cef-dll-sys = "=152.3.0"
# The relay between the agent's browser tools and the browser: see
# `src/relay.rs`.
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# Reading only the head of what the browser sends the agent: see
# `src/relay.rs`.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tracing.workspace = true

# CEF expects a little of the app's Objective-C class on macOS: see
# `src/macos.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[dev-dependencies]
tempfile = "3.27.0"
