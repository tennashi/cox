<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Activity</title>
    <link rel="stylesheet" href="cox://api/theme.css" />
    <style>
      /* The colors of the window, which Cox gives every plugin as
         `cox://api/theme.css` (see `ui::theme`): the page sits on the
         stage's card, as Cox's own tabs do. */
      :root {
        --sans: -apple-system, "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        --mono: Menlo, "DejaVu Sans Mono", monospace;
      }
      html,
      body {
        margin: 0;
        background: var(--surface);
        color: var(--foreground);
        font: 13px/1.5 var(--sans);
      }
      #app {
        padding: 12px 16px 40px;
        box-sizing: border-box;
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      /* The heading, as Cox's own tabs have it (see `stage::heading`):
         the title, a line on what the tab shows, and, at the right
         edge, where it shows it from. */
      .head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 4px;
        min-height: 26px;
        margin-bottom: 4px;
        white-space: nowrap;
      }
      .head h1 {
        flex: none;
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      .head .summary {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--dim);
      }
      .head .where {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: right;
        font: 11.5px var(--mono);
        color: var(--faint);
      }
      .tier {
        font: 600 10.5px var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 16px 0 6px;
        padding: 0 4px;
      }
      .tier b {
        color: var(--asking);
        margin-left: 4px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        border-radius: 8px;
        padding: 7px 10px;
        color: var(--foreground);
      }
      a.row:hover {
        background: var(--hover);
        text-decoration: none;
      }
      .waiting .row {
        background: var(--surface);
        border: 1px solid var(--border);
        margin-bottom: 6px;
      }
      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        align-self: center;
      }
      .dot.asks {
        background: var(--asking);
      }
      .dot.unread {
        background: var(--accent);
      }
      .row .name {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .row .why {
        color: var(--dim);
      }
      .row .in {
        font: 11.5px var(--mono);
        color: var(--faint);
      }
      .row .goal {
        color: var(--faint);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .row .when {
        flex: none;
        width: 112px;
        font: 11.5px var(--mono);
        color: var(--faint);
      }
      .row .kind {
        flex: none;
        width: 62px;
        font: 600 9.5px var(--sans);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .row .says {
        color: var(--dim);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .row .what {
        min-width: 0;
      }
      .none {
        color: var(--dim);
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="app.js"></script>
  </body>
</html>
