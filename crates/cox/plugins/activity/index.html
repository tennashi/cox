<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Activity</title>
    <link rel="stylesheet" href="cox://api/theme.css" />
    <style>
      /* The colors of the window, which Cox gives every plugin as
         `cox://api/theme.css` (see `ui::theme`): the page sits on the
         stage's card, as Cox's own tabs do. */
      :root {
        --sans: -apple-system, "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        --mono: Menlo, "DejaVu Sans Mono", monospace;
      }
      html,
      body {
        margin: 0;
        background: var(--surface);
        color: var(--foreground);
        font: 13px/1.5 var(--sans);
      }
      #app {
        padding: 12px 16px 40px;
        box-sizing: border-box;
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      /* The heading, as Cox's own tabs have it (see `stage::heading`):
         the title, a line on what the tab shows, and, at the right
         edge, where it shows it from. */
      .head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 4px;
        min-height: 26px;
        margin-bottom: 4px;
        white-space: nowrap;
      }
      .head h1 {
        flex: none;
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      .head .summary {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--dim);
      }
      .head .where {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: right;
        font: 11.5px var(--mono);
        color: var(--faint);
      }
      .tier {
        font: 600 10.5px var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 16px 0 6px;
        padding: 0 4px;
      }
      .tier b {
        color: var(--asking);
        margin-left: 4px;
      }
      .tier i {
        font-style: normal;
        color: var(--accent);
        margin-left: 4px;
      }
      /* What is asked and at work on the left, what was decided on the
         right, once the page is wide enough for both. */
      .columns {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        column-gap: 20px;
      }
      @media (min-width: 760px) {
        .columns {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        border-radius: 8px;
        padding: 7px 10px;
        color: var(--foreground);
      }
      a.row:hover {
        background: var(--hover);
        text-decoration: none;
      }
      .waiting .row {
        background: var(--surface);
        border: 1px solid var(--border);
        margin-bottom: 6px;
      }
      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        align-self: center;
      }
      .dot.asks {
        background: var(--asking);
      }
      .dot.unread {
        background: var(--accent);
      }
      .dot.busy {
        border: 2px solid var(--accent);
        border-right-color: transparent;
        width: 6px;
        height: 6px;
        animation: turn 1s linear infinite;
      }
      .dot.idle {
        border: 1.5px solid var(--faint);
        width: 5px;
        height: 5px;
      }
      /* A chat's plan hangs under its row, out of the link, so that each
         subagent's chat under a step is a link of its own. */
      .plan {
        margin: -2px 0 8px;
        font-size: 12px;
      }
      .plan .count {
        font: 600 9.5px var(--sans);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--faint);
        margin-bottom: 2px;
      }
      /* Hides a plan, or every plan not at work, as a word in the line
         it sits in. */
      .dismiss {
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        color: var(--faint);
        background: none;
        border: 0;
        padding: 0;
        margin-left: 10px;
        cursor: pointer;
      }
      .dismiss:hover {
        color: var(--link);
      }
      .plan .step {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 1px 0;
      }
      .plan .mark {
        flex: none;
        width: 12px;
        color: var(--faint);
      }
      .plan .in_progress .mark {
        color: var(--accent);
      }
      .plan .completed .text {
        color: var(--dim);
      }
      .plan .sub {
        display: flex;
        align-items: baseline;
        gap: 6px;
        color: var(--foreground);
      }
      .plan .line {
        color: var(--dim);
        margin-left: 14px;
        overflow-wrap: anywhere;
      }
      @keyframes turn {
        to {
          transform: rotate(360deg);
        }
      }
      .row .line,
      .decision .line {
        color: var(--dim);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .row .running {
        font: 11.5px var(--mono);
        color: var(--foreground);
        overflow-wrap: anywhere;
      }
      .row .running .prompt {
        color: var(--faint);
      }
      /* What runs in the background is named by what the agent said it
         does, not by the command, so it reads as words, a command marked
         as one by the cue of the stage's terminal. */
      .row .background {
        font-size: 12px;
        color: var(--foreground);
        overflow-wrap: anywhere;
      }
      .row .background .cue {
        font: 600 10.5px var(--mono);
        color: var(--faint);
        margin-right: 6px;
      }
      .decision {
        padding: 7px 10px;
        border-bottom: 1px solid var(--border);
        overflow-wrap: anywhere;
      }
      .decision .header {
        font: 600 9.5px var(--sans);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .decision .arrow {
        color: var(--faint);
      }
      .decision .choice {
        font-weight: 600;
      }
      .decision .other {
        color: var(--dim);
      }
      .decision .meta {
        font: 11.5px var(--mono);
        color: var(--faint);
      }
      .row .name {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .row .why {
        color: var(--dim);
      }
      .row .in {
        font: 11.5px var(--mono);
        color: var(--faint);
      }
      .row .goal {
        color: var(--faint);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .row .when {
        flex: none;
        width: 112px;
        font: 11.5px var(--mono);
        color: var(--faint);
      }
      .row .kind {
        flex: none;
        width: 62px;
        font: 600 9.5px var(--sans);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .row .says {
        color: var(--dim);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .row .what {
        min-width: 0;
      }
      .none {
        color: var(--dim);
        padding: 6px 10px;
      }
      .pull {
        font-size: 12px;
        color: var(--foreground);
        overflow-wrap: anywhere;
      }
      .pull .number {
        font: 11.5px var(--mono);
        color: var(--link);
      }
      .pull .draft,
      .pull .ci {
        font: 600 9.5px var(--sans);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .pull .ci.running {
        color: var(--link);
      }
      .pull .ci.passed {
        color: var(--accent);
      }
      .pull .ci.failed {
        color: var(--asking);
      }
      .notice {
        color: var(--dim);
        font-size: 12px;
        padding: 0 0 8px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="app.js"></script>
  </body>
</html>
