<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Activity</title>
    <link rel="stylesheet" href="cox://api/theme.css" />
    <style>
      /* The colors of the window, which Cox gives every plugin as
         `cox://api/theme.css` (see `ui::theme`): the page sits on the
         stage's card, as Cox's own tabs do. Beside them, the page keeps
         to three sizes of type, one weight for names, a scale of space
         and one radius, and gives color only to how a chat stands. */
      :root {
        --sans: -apple-system, "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        --mono: Menlo, "DejaVu Sans Mono", monospace;
        --small: 11px;
        --body: 13px;
        --title: 15px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 24px;
        --radius: 6px;
      }
      html,
      body {
        margin: 0;
        background: var(--surface);
        color: var(--foreground);
        font: var(--body) / 1.5 var(--sans);
      }
      #app {
        padding: var(--space-3) var(--space-4) 40px;
        box-sizing: border-box;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
      }
      /* The heading, as Cox's own tabs have it (see `stage::heading`):
         the title and, at the right edge, where it shows it from. */
      .head {
        display: flex;
        align-items: baseline;
        gap: var(--space-3);
        min-height: 26px;
        margin-bottom: var(--space-2);
        white-space: nowrap;
      }
      .head h1 {
        flex: none;
        margin: 0;
        font-size: var(--title);
        font-weight: 600;
      }
      .head .where {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: right;
        font: var(--small) var(--mono);
        color: var(--faint);
      }
      .notice {
        color: var(--dim);
        font-size: var(--small);
        margin-bottom: var(--space-2);
      }
      /* How it all stands, in three numbers, then every step of every
         plan in one bar. */
      .numbers {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--space-2);
        margin-bottom: var(--space-3);
      }
      .number {
        background: var(--pane);
        border-radius: var(--radius);
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--card-edge);
      }
      .number .count {
        font-size: var(--title);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .number .what {
        color: var(--dim);
        font-size: var(--small);
      }
      .number.yours .count {
        color: var(--asking);
      }
      .number.work .count {
        color: var(--accent);
      }
      .pick {
        font-size: var(--small);
        color: var(--faint);
        background: none;
        border: 0;
        padding: 0 2px;
        cursor: pointer;
      }
      .pick:hover {
        color: var(--link);
      }
      .pick.picked {
        color: var(--foreground);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .overall {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        color: var(--dim);
        font-size: var(--small);
        margin-bottom: var(--space-4);
        white-space: nowrap;
      }
      .overall .bar {
        flex: 1;
      }
      /* A bar of steps: one block a step. */
      .bar {
        display: flex;
        gap: 2px;
        height: 6px;
        min-width: 0;
      }
      .bar i {
        flex: 1;
        min-width: 0;
        border-radius: 2px;
        background: var(--button-hover);
      }
      .bar i.completed {
        background: var(--accent);
        opacity: 0.5;
      }
      .bar i.in_progress {
        background: var(--accent);
      }
      .yours .bar i.in_progress {
        background: var(--asking);
      }
      .group {
        margin-bottom: var(--space-4);
      }
      .group h2 {
        font-size: var(--small);
        font-weight: normal;
        color: var(--faint);
        margin: 0 0 var(--space-1);
        padding: 0 var(--space-2);
      }
      .none {
        color: var(--dim);
        padding: var(--space-2);
      }
      /* A chat: one line, which a click opens. */
      .row {
        display: grid;
        grid-template-columns: 8px minmax(0, 1.1fr) minmax(48px, 110px) 32px minmax(0, 1.4fr);
        align-items: center;
        gap: var(--space-3);
        padding: 6px var(--space-2);
        border-radius: var(--radius);
        cursor: pointer;
      }
      .row:hover {
        background: var(--hover);
      }
      .row.open {
        background: var(--pane);
        border-radius: var(--radius) var(--radius) 0 0;
      }
      .row.under {
        padding-left: calc(var(--space-2) + 16px);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--disabled);
      }
      .yours .dot {
        background: var(--asking);
      }
      .work .dot {
        background: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-ground);
      }
      .ci .dot {
        border: 2px solid var(--accent);
        border-right-color: transparent;
        background: none;
        width: 4px;
        height: 4px;
        animation: turn 1s linear infinite;
      }
      .done .dot {
        background: none;
        border: 1.5px solid var(--accent);
        width: 5px;
        height: 5px;
      }
      @keyframes turn {
        to {
          transform: rotate(360deg);
        }
      }
      .name {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .name a:hover {
        color: var(--link);
      }
      .name .aside,
      .hint {
        color: var(--faint);
        font-weight: normal;
        font-size: var(--small);
      }
      .steps {
        font: var(--small) var(--mono);
        color: var(--faint);
        text-align: right;
      }
      .now {
        color: var(--dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .yours .now {
        color: var(--asking);
      }
      /* What is done, or stopped, steps back. */
      .done .name,
      .done .now,
      .stopped .name,
      .stopped .now {
        color: var(--dim);
      }
      /* The chat opened: what it is, its story in time, how it ended, and
         its steps. */
      .opened {
        background: var(--pane);
        border-radius: 0 0 var(--radius) var(--radius);
        padding: var(--space-1) var(--space-3) var(--space-3);
        margin-bottom: var(--space-2);
      }
      .meta {
        color: var(--faint);
        font-size: var(--small);
        padding-bottom: var(--space-2);
      }
      .dismiss {
        font-size: var(--small);
        color: var(--faint);
        background: none;
        border: 0;
        padding: 0;
        margin-left: var(--space-2);
        cursor: pointer;
      }
      .dismiss:hover {
        color: var(--link);
      }
      /* The story, and the steps beside it: the story the wider, as its
         lines are longer; one under the other only where the two would
         be too narrow to read. */
      .opened {
        container-type: inline-size;
      }
      .columns {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
        column-gap: var(--space-4);
        align-items: start;
      }
      .columns.alone {
        grid-template-columns: minmax(0, 1fr);
      }
      @container (max-width: 480px) {
        .columns {
          grid-template-columns: minmax(0, 1fr);
        }
        .columns .plan {
          margin-top: var(--space-3);
          padding-top: var(--space-2);
          border-top: 1px solid var(--border);
        }
      }
      .event,
      .end {
        display: grid;
        grid-template-columns: 44px 16px minmax(0, 1fr);
        align-items: baseline;
        column-gap: var(--space-1);
        padding: 1px 0;
      }
      .step {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr);
        align-items: baseline;
        column-gap: var(--space-1);
        padding: 1px 0;
      }
      .event .at,
      .end .at {
        font: var(--small) var(--mono);
        color: var(--faint);
        white-space: nowrap;
      }
      .event .mark,
      .end .mark,
      .step .mark {
        text-align: center;
        color: var(--faint);
        font-size: var(--small);
      }
      .event .text {
        color: var(--dim);
        overflow-wrap: anywhere;
      }
      .event .text b {
        font-weight: normal;
        color: var(--foreground);
      }
      .event.start .text,
      .event.answered .text,
      .event.running .text {
        color: var(--foreground);
      }
      .event.step_started .mark,
      .event.step_done .mark,
      .event.running .mark {
        color: var(--accent);
      }
      .event.asked .mark,
      .event.asked .text {
        color: var(--asking);
      }
      .event.plan_revised.dropped .mark,
      .event.plan_revised.dropped .text b {
        color: var(--asking);
      }
      .event .revised {
        display: block;
        font-size: var(--small);
        padding-left: var(--space-2);
        border-left: 2px solid var(--border-strong);
      }
      .event .revised .added {
        color: var(--asking);
      }
      .event .revised .removed {
        color: var(--faint);
        text-decoration: line-through;
      }
      .event.said .text {
        font-size: var(--small);
        padding-left: var(--space-2);
        border-left: 2px solid var(--border-strong);
      }
      .event.ci.failed .text,
      .event.turn_end.failed .text {
        color: var(--failed);
      }
      .event .lines,
      .event .number {
        font: var(--small) var(--mono);
      }
      .event .lines {
        color: var(--faint);
      }
      .event .number {
        color: var(--link);
      }
      .event .text a {
        color: var(--link);
      }
      .end {
        margin-top: var(--space-1);
        padding-top: var(--space-2);
        border-top: 1px solid var(--border);
      }
      .end .at {
        color: var(--foreground);
      }
      .end .how {
        font-weight: 600;
      }
      .end .how span {
        font-weight: normal;
        color: var(--dim);
      }
      .end.work .mark,
      .end.work .how,
      .end.done .mark,
      .end.done .how {
        color: var(--accent);
      }
      .end.yours .mark,
      .end.yours .how {
        color: var(--asking);
      }
      .end.failed .mark,
      .end.failed .how {
        color: var(--failed);
      }
      .plan .count {
        font-size: var(--small);
        color: var(--faint);
        padding-bottom: var(--space-1);
      }
      .step .text {
        overflow-wrap: anywhere;
      }
      .step.completed .text {
        color: var(--dim);
      }
      .step.in_progress .mark {
        color: var(--accent);
      }
      /* A step opens its thread with a click. */
      .opens {
        cursor: pointer;
      }
      .opens:hover,
      .opens.shown {
        color: var(--link);
      }
      .on {
        color: var(--faint);
        font-size: var(--small);
      }
      .sub {
        display: block;
        color: var(--dim);
        font-size: var(--small);
      }
      .sub:hover {
        color: var(--link);
      }
      .thread {
        margin: var(--space-1) 0 var(--space-2);
        padding: var(--space-2);
        border: 1px solid var(--card-edge);
        border-radius: var(--radius);
        font-size: var(--small);
        background: var(--pane);
      }
      .thread .said {
        padding: 2px 0;
      }
      .thread .by {
        display: block;
        color: var(--faint);
      }
      .thread .says {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: var(--body);
      }
      .thread .agent .says,
      .thread .waiting .says {
        color: var(--dim);
      }
      .thread .waiting .says {
        font-style: italic;
      }
      .thread .write {
        display: flex;
        gap: var(--space-1);
        margin-top: var(--space-1);
      }
      .thread textarea {
        flex: 1;
        font: inherit;
        font-size: var(--body);
        color: var(--foreground);
        background: var(--inset-ground);
        border: 1px solid var(--inset-edge);
        border-radius: var(--radius-input);
        padding: var(--space-1) var(--space-2);
        resize: vertical;
        box-shadow: var(--inset-shadow);
      }
      .thread textarea:focus {
        outline: none;
        box-shadow: var(--inset-shadow), var(--focus-ring);
      }
      .thread button {
        color: var(--link);
        background: var(--button);
        border: 1px solid var(--control-edge);
        border-radius: var(--radius);
        cursor: pointer;
        box-shadow: var(--control-shadow);
      }
      .thread :disabled {
        opacity: 0.5;
        cursor: default;
      }
      .thread .why {
        color: var(--dim);
        margin-top: var(--space-1);
      }
      .pull {
        font-size: var(--small);
        color: var(--dim);
        margin-left: 48px;
      }
      .pull .number {
        font-family: var(--mono);
        color: var(--link);
      }
      .pull .ci.running {
        color: var(--link);
      }
      .pull .ci.passed {
        color: var(--accent);
      }
      .pull .ci.failed {
        color: var(--failed);
      }
      .background {
        font-size: var(--small);
        color: var(--dim);
        margin-left: 48px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="app.js"></script>
  </body>
</html>
