<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Activity</title>
    <link rel="stylesheet" href="cox://api/theme.css" />
    <style>
      /* The colors of the window, which Cox gives every plugin as
         `cox://api/theme.css` (see `ui::theme`): the page sits on the
         stage's card, as Cox's own tabs do. Beside them, the page keeps
         to three sizes of type, one weight for names, a scale of space
         and one radius, and gives color only to how a chat stands. */
      :root {
        --sans: -apple-system, "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        --mono: Menlo, "DejaVu Sans Mono", monospace;
        --small: 11px;
        --body: 13px;
        --title: 15px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 24px;
        --radius: 6px;
        /* How far each subagent's name steps in from the chat's above,
           and how wide what folds them away is, with the space after. */
        --indent-step: 16px;
        --fold: 16px;
      }
      html,
      body {
        margin: 0;
        background: var(--surface);
        color: var(--foreground);
        font: var(--body) / 1.5 var(--sans);
      }
      #app {
        padding: var(--space-3) var(--space-4) 40px;
        box-sizing: border-box;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
      }
      /* The heading, as Cox's own tabs have it (see `stage::heading`):
         the title and, at the right edge, where it shows it from. */
      .head {
        display: flex;
        align-items: baseline;
        gap: var(--space-3);
        min-height: 26px;
        margin-bottom: var(--space-2);
        white-space: nowrap;
      }
      .head h1 {
        flex: none;
        margin: 0;
        font-size: var(--title);
        font-weight: 600;
      }
      .head .where {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: right;
        font: var(--small) var(--mono);
        color: var(--faint);
      }
      .notice {
        color: var(--dim);
        font-size: var(--small);
        margin-bottom: var(--space-2);
      }
      /* How it all stands, in three numbers, then every step of every
         plan in one bar. */
      .numbers {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--space-2);
        margin-bottom: var(--space-3);
      }
      .number {
        background: var(--pane);
        border-radius: var(--radius);
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--card-edge);
      }
      .number .count {
        font-size: var(--title);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .number .what {
        color: var(--dim);
        font-size: var(--small);
      }
      .number.yours .count {
        color: var(--asking);
      }
      .number.work .count {
        color: var(--accent);
      }
      .pick {
        font-size: var(--small);
        color: var(--faint);
        background: none;
        border: 0;
        padding: 0 2px;
        cursor: pointer;
      }
      .pick:hover {
        color: var(--link);
      }
      .pick.picked {
        color: var(--foreground);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .overall {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        color: var(--dim);
        font-size: var(--small);
        margin-bottom: var(--space-4);
        white-space: nowrap;
      }
      .overall .bar {
        flex: 1;
      }
      /* A bar of steps: one block a step. */
      .bar {
        display: flex;
        gap: 2px;
        height: 6px;
        min-width: 0;
      }
      .bar i {
        flex: 1;
        min-width: 0;
        border-radius: 2px;
        background: var(--button-hover);
      }
      .bar i.completed {
        background: var(--accent);
        opacity: 0.5;
      }
      .bar i.in_progress {
        background: var(--accent);
      }
      .yours .bar i.in_progress {
        background: var(--asking);
      }
      .group {
        margin-bottom: var(--space-4);
        container-type: inline-size;
      }
      .group h2 {
        font-size: var(--small);
        font-weight: normal;
        color: var(--faint);
        margin: 0 0 var(--space-1);
        padding: 0 var(--space-2);
      }
      .none {
        color: var(--dim);
        padding: var(--space-2);
      }
      /* A chat: one line, which a click opens, its name stepped in as
         deep as it is under the chat at the top of its, and the rest in
         columns, alike at every depth. */
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(48px, 110px) 32px minmax(0, 1.2fr);
        align-items: center;
        gap: var(--space-3);
        padding: 6px var(--space-2);
        border-radius: var(--radius);
        cursor: pointer;
      }
      .row:hover {
        background: var(--hover);
      }
      .row.open {
        background: var(--pane);
        border-radius: var(--radius) var(--radius) 0 0;
      }
      /* The chat the window shows, by a bar down its left edge. */
      .row.shown {
        box-shadow: inset 2px 0 0 var(--accent);
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
      }
      /* A step of a chat's plan that subagents came from, over them. */
      .from {
        display: flex;
        align-items: baseline;
        gap: var(--space-1);
        padding: 2px var(--space-2);
        padding-left: calc(var(--space-2) + var(--indent) * var(--indent-step) + var(--fold));
        color: var(--faint);
        font-size: var(--small);
        min-width: 0;
      }
      .from .text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .from.in_progress .mark {
        color: var(--accent);
      }
      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--disabled);
      }
      .yours .dot {
        background: var(--asking);
      }
      .work .dot {
        background: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-ground);
      }
      .ci .dot {
        border: 2px solid var(--accent);
        border-right-color: transparent;
        background: none;
        width: 4px;
        height: 4px;
        animation: turn 1s linear infinite;
      }
      .done .dot {
        background: none;
        border: 1.5px solid var(--accent);
        width: 5px;
        height: 5px;
      }
      /* Not at work itself, but the subagents under it are. */
      .subs .dot {
        background: none;
        border: 1.5px dashed var(--accent);
        width: 5px;
        height: 5px;
      }
      @keyframes turn {
        to {
          transform: rotate(360deg);
        }
      }
      .name {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        min-width: 0;
        padding-left: calc(var(--indent, 0) * var(--indent-step));
        font-weight: 600;
        white-space: nowrap;
      }
      .name a,
      .name .hint {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* How many subagents are under a chat, which folds them away. */
      .fold {
        flex: none;
        width: calc(var(--fold) - var(--space-1));
        color: var(--faint);
        font-size: var(--small);
        font-weight: normal;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .fold.more {
        width: auto;
        padding: 0 2px;
      }
      .fold:hover {
        color: var(--link);
      }
      .name a:hover {
        color: var(--link);
      }
      .hint {
        color: var(--faint);
        font-weight: normal;
        font-size: var(--small);
      }
      .steps {
        font: var(--small) var(--mono);
        color: var(--faint);
        text-align: right;
      }
      .now {
        color: var(--dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .yours .now {
        color: var(--asking);
      }
      /* What is done, or stopped, steps back. */
      .done .name,
      .done .now,
      .stopped .name,
      .stopped .now {
        color: var(--dim);
      }
      /* The chat opened: what it is, its story in time, how it ended, and
         its steps. */
      .opened {
        background: var(--pane);
        border-radius: 0 0 var(--radius) var(--radius);
        padding: var(--space-1) var(--space-3) var(--space-3);
        margin-bottom: var(--space-2);
      }
      .meta {
        color: var(--faint);
        font-size: var(--small);
        padding-bottom: var(--space-2);
      }
      .dismiss {
        font-size: var(--small);
        color: var(--faint);
        background: none;
        border: 0;
        padding: 0;
        margin-left: var(--space-2);
        cursor: pointer;
      }
      .dismiss:hover {
        color: var(--link);
      }
      /* The story, and the steps beside it: the story the wider, as its
         lines are longer; one under the other only where the two would
         be too narrow to read. */
      .opened {
        container-type: inline-size;
      }
      .columns {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
        column-gap: var(--space-4);
        align-items: start;
      }
      .columns.alone {
        grid-template-columns: minmax(0, 1fr);
      }
      /* Narrow, a chat's line goes on two, its name over how far it got
         and what it does, and each step in is shorter. */
      @container (max-width: 480px) {
        .row,
        .from {
          --indent-step: 10px;
        }
        .row {
          grid-template-columns: auto minmax(0, 1fr) auto;
          grid-template-areas: "name name steps" "bar now now";
          row-gap: 2px;
          column-gap: var(--space-2);
        }
        .row .name {
          grid-area: name;
        }
        /* Under the name, past what folds and the dot. */
        .row .bar {
          grid-area: bar;
          width: 64px;
          margin-left: calc(var(--indent, 0) * var(--indent-step) + var(--fold) + 18px);
        }
        .row .bar:empty {
          width: 0;
        }
        .row .steps {
          grid-area: steps;
        }
        .row .now {
          grid-area: now;
        }
        .columns {
          grid-template-columns: minmax(0, 1fr);
        }
        .columns .plan {
          margin-top: var(--space-3);
          padding-top: var(--space-2);
          border-top: 1px solid var(--border);
        }
      }
      .event,
      .end {
        display: grid;
        grid-template-columns: 44px 16px minmax(0, 1fr);
        align-items: baseline;
        column-gap: var(--space-1);
        padding: 1px 0;
      }
      .step {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr);
        align-items: baseline;
        column-gap: var(--space-1);
        padding: 1px 0;
      }
      .event .at,
      .end .at {
        font: var(--small) var(--mono);
        color: var(--faint);
        white-space: nowrap;
      }
      .event .mark,
      .end .mark,
      .step .mark {
        text-align: center;
        color: var(--faint);
        font-size: var(--small);
      }
      .event .text {
        color: var(--dim);
        overflow-wrap: anywhere;
      }
      .event .text b {
        font-weight: normal;
        color: var(--foreground);
      }
      .event.start .text,
      .event.answered .text,
      .event.running .text {
        color: var(--foreground);
      }
      .event.step_started .mark,
      .event.step_done .mark,
      .event.running .mark {
        color: var(--accent);
      }
      .event.asked .mark,
      .event.asked .text {
        color: var(--asking);
      }
      .event.plan_revised.dropped .mark,
      .event.plan_revised.dropped .text b {
        color: var(--asking);
      }
      .event .revised {
        display: block;
        font-size: var(--small);
        padding-left: var(--space-2);
        border-left: 2px solid var(--border-strong);
      }
      .event .revised .added {
        color: var(--asking);
      }
      .event .revised .removed {
        color: var(--faint);
        text-decoration: line-through;
      }
      .event.said .text {
        font-size: var(--small);
        padding-left: var(--space-2);
        border-left: 2px solid var(--border-strong);
      }
      .event.ci.failed .text,
      .event.turn_end.failed .text,
      .event.check.failed .text {
        color: var(--failed);
      }
      .event.check.failed .mark {
        color: var(--failed);
      }
      /* What a line printed, as a check that failed, a click away. */
      .event .opener {
        font-size: var(--small);
        color: var(--faint);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      .event .opener:hover {
        color: var(--link);
      }
      /* The commands of a step the agent ran that ran long or failed,
         each on a line of its own, under what it said before them: what
         it said it is for, then the command, fainter, as its gist. */
      .event.ran .said {
        color: var(--foreground);
      }
      .event.ran .lines {
        white-space: nowrap;
      }
      .event .command {
        display: flex;
        gap: var(--space-2);
        align-items: baseline;
        margin-top: 2px;
        padding: 0 var(--space-1);
        border-radius: var(--radius);
        font: var(--small) / 1.6 var(--mono);
        cursor: pointer;
      }
      .event .command:hover,
      .event .command.open {
        background: var(--accent-tint);
      }
      .event .command .ended {
        flex: none;
        color: var(--accent);
      }
      .event .command.failed .ended,
      .event .command.failed .about,
      .event .command.failed .gist {
        color: var(--failed);
      }
      .event .command.cancelled .ended {
        color: var(--faint);
      }
      .event .command .line {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .event .command .about {
        margin-right: var(--space-2);
        font: var(--body) var(--sans);
        color: var(--foreground);
      }
      .event .command .about + .gist {
        color: var(--dim);
      }
      .event .command .secs {
        flex: none;
        color: var(--faint);
      }
      .event .under {
        margin: 2px 0 var(--space-2);
        border: 1px solid var(--card-edge);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .event .under .printed {
        margin: 0;
        border: none;
        border-top: 1px solid var(--border);
        border-radius: 0;
      }
      /* A command laid out: a row for each command of a chain, after what
         joins it to the one before, in a gutter at the left edge, and its
         code indented as deep as the block it is in. */
      .laid {
        position: relative;
        padding: var(--space-1) var(--space-2);
        background: var(--ground);
        font: var(--small) / 1.55 var(--mono);
        color: var(--foreground);
      }
      .laid-row {
        display: flex;
      }
      .laid .joint {
        flex: none;
        width: calc(3ch + var(--depth) * 2ch);
        color: var(--faint);
      }
      .laid .code {
        min-width: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .piece-fold {
        display: inline-block;
        margin: 0 0.5ch;
        padding: 0 6px;
        border-radius: 4px;
        background: var(--button);
        color: var(--dim);
        font: var(--small) / 1.6 var(--sans);
        cursor: pointer;
        user-select: none;
        box-shadow: 0 0 0 1px var(--control-edge);
      }
      .piece-fold:hover {
        color: var(--foreground);
      }
      .piece-body {
        margin: 2px 0 4px calc(var(--depth, 0) * 2ch + 3ch);
        padding: 2px 0 2px 10px;
        border-left: 2px solid var(--border);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--dim);
      }
      .laid .copy {
        position: absolute;
        top: 4px;
        right: 6px;
        padding: 1px 8px;
        border: 1px solid var(--control-edge);
        border-radius: 4px;
        background: var(--button);
        color: var(--dim);
        font: var(--small) var(--sans);
        cursor: pointer;
        opacity: 0;
        box-shadow: var(--control-shadow);
      }
      .laid:hover .copy {
        opacity: 1;
      }
      .laid .copy:hover {
        color: var(--foreground);
      }
      /* The code's colors, as the code tabs draw them (and the Map). */
      .hl-keyword,
      .hl-variable-builtin,
      .hl-tag,
      .hl-punctuation-special {
        color: #569cd6;
      }
      .hl-function {
        color: #dcdcaa;
      }
      .hl-type,
      .hl-type-builtin,
      .hl-constructor {
        color: #4ec9b0;
      }
      .hl-string,
      .hl-literal {
        color: #ce9178;
      }
      .hl-string-special,
      .hl-escape {
        color: #d7ba7d;
      }
      .hl-number,
      .hl-constant-builtin {
        color: #b5cea8;
      }
      .hl-comment {
        color: #6a9955;
      }
      .hl-constant,
      .hl-uri {
        color: #4fc1ff;
      }
      .hl-property,
      .hl-variable {
        color: #9cdcfe;
      }
      .hl-attribute,
      .hl-label {
        color: #c586c0;
      }
      /* What sets up the environment, as `CARGO_TARGET_DIR=…`, which the
         eye can pass over. */
      .hl-quiet {
        color: var(--faint);
      }
      .event .printed {
        margin: var(--space-1) 0 var(--space-2);
        padding: var(--space-1) var(--space-2);
        max-height: 240px;
        overflow: auto;
        font: var(--small) / 1.5 var(--mono);
        color: var(--dim);
        background: var(--inset-ground);
        border: 1px solid var(--card-edge);
        border-radius: var(--radius);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .event .lines,
      .event .number {
        font: var(--small) var(--mono);
      }
      .event .lines {
        color: var(--faint);
      }
      .event .number {
        color: var(--link);
      }
      .event .text a {
        color: var(--link);
      }
      /* The day the lines under it are of, where it changes, as the
         column of times has room for the time of day alone. */
      .day {
        font: var(--small) var(--mono);
        color: var(--faint);
        padding: var(--space-1) 0 1px;
      }
      .day:first-child {
        padding-top: 0;
      }
      .day.ending {
        margin-top: var(--space-1);
        padding-top: var(--space-2);
        border-top: 1px solid var(--border);
      }
      .day.ending + .end {
        margin-top: 0;
        padding-top: 1px;
        border-top: none;
      }
      .end {
        margin-top: var(--space-1);
        padding-top: var(--space-2);
        border-top: 1px solid var(--border);
      }
      .end .at {
        color: var(--foreground);
      }
      .end .how {
        font-weight: 600;
      }
      .end .how span {
        font-weight: normal;
        color: var(--dim);
      }
      .end.work .mark,
      .end.work .how,
      .end.done .mark,
      .end.done .how {
        color: var(--accent);
      }
      .end.yours .mark,
      .end.yours .how {
        color: var(--asking);
      }
      .end.failed .mark,
      .end.failed .how {
        color: var(--failed);
      }
      .plan .count {
        font-size: var(--small);
        color: var(--faint);
        padding-bottom: var(--space-1);
      }
      .step .text {
        overflow-wrap: anywhere;
      }
      .step.completed .text {
        color: var(--dim);
      }
      .step.in_progress .mark {
        color: var(--accent);
      }
      /* A step opens its thread with a click. */
      .opens {
        cursor: pointer;
      }
      .opens:hover,
      .opens.shown {
        color: var(--link);
      }
      .on {
        color: var(--faint);
        font-size: var(--small);
      }
      .thread {
        margin: var(--space-1) 0 var(--space-2);
        padding: var(--space-2);
        border: 1px solid var(--card-edge);
        border-radius: var(--radius);
        font-size: var(--small);
        background: var(--pane);
      }
      .thread .said {
        padding: 2px 0;
      }
      .thread .by {
        display: block;
        color: var(--faint);
      }
      .thread .says {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: var(--body);
      }
      .thread .agent .says,
      .thread .waiting .says {
        color: var(--dim);
      }
      .thread .waiting .says {
        font-style: italic;
      }
      .thread .write {
        display: flex;
        gap: var(--space-1);
        margin-top: var(--space-1);
      }
      .thread textarea {
        flex: 1;
        font: inherit;
        font-size: var(--body);
        color: var(--foreground);
        background: var(--inset-ground);
        border: 1px solid var(--inset-edge);
        border-radius: var(--radius-input);
        padding: var(--space-1) var(--space-2);
        resize: vertical;
        box-shadow: var(--inset-shadow);
      }
      .thread textarea:focus {
        outline: none;
        box-shadow: var(--inset-shadow), var(--focus-ring);
      }
      .thread button {
        color: var(--link);
        background: var(--button);
        border: 1px solid var(--control-edge);
        border-radius: var(--radius);
        cursor: pointer;
        box-shadow: var(--control-shadow);
      }
      .thread :disabled {
        opacity: 0.5;
        cursor: default;
      }
      .thread .why {
        color: var(--dim);
        margin-top: var(--space-1);
      }
      .pull {
        font-size: var(--small);
        color: var(--dim);
        margin-left: 48px;
      }
      .pull .number {
        font-family: var(--mono);
        color: var(--link);
      }
      .pull .ci.running {
        color: var(--link);
      }
      .pull .ci.passed {
        color: var(--accent);
      }
      .pull .ci.failed {
