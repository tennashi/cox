<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Activity</title>
    <style>
      /* The colors of the window (see `ui::theme`), as the other
         plugins have them: the page sits on the stage's card, as Cox's
         own tabs do. */
      :root {
        color-scheme: dark;
        --foreground: #e4e4e6;
        --background: #151517;
        --card: #17171a;
        --card-hover: #1f1f23;
        --dim: #a5a5ab;
        --faint: #8e8e95;
        --link: #a6ebe1;
        --border: #2c2c31;
        --hover: #222226;
        --accent: #6fd3c5;
        --code: #e7b98a;
        --code-ground: #1d1d21;
        --warn: #e8b660;
        --broken: #ec8580;
        --asking: #e5b46d;
        --sans: -apple-system, "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        --mono: Menlo, "DejaVu Sans Mono", monospace;
      }
      html,
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font: 13px/1.5 var(--sans);
      }
      #app {
        max-width: 760px;
        margin: 0 auto;
        padding: 12px 20px 40px;
        box-sizing: border-box;
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      .head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
        margin-bottom: 4px;
      }
      .head h1 {
        font-size: 15px;
        margin: 0;
      }
      .head .where {
        margin-left: auto;
        font-size: 11.5px;
        color: var(--faint);
        font-family: var(--mono);
        overflow-wrap: anywhere;
      }
      .tier {
        font: 600 10.5px var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 18px 0 6px;
      }
      .tier b {
        color: var(--asking);
        margin-left: 4px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        border-radius: 8px;
        padding: 7px 10px;
        color: var(--foreground);
      }
      a.row:hover {
        background: var(--card-hover);
        text-decoration: none;
      }
      .waiting .row {
        background: var(--card);
        border: 1px solid var(--border);
        margin-bottom: 6px;
      }
      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        align-self: center;
      }
      .dot.asks {
        background: var(--asking);
      }
      .dot.unread {
        background: var(--accent);
      }
      .row .name {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .row .why {
        color: var(--dim);
      }
      .row .goal {
        color: var(--faint);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .row .when {
        flex: none;
        width: 112px;
        font: 11.5px var(--mono);
        color: var(--faint);
      }
      .row .kind {
        flex: none;
        width: 62px;
        font: 600 9.5px var(--sans);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .row .says {
        color: var(--dim);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .row .what {
        min-width: 0;
      }
      .none {
        color: var(--dim);
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="app.js"></script>
  </body>
</html>
