<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Activity</title>
    <link rel="stylesheet" href="cox://api/theme.css" />
    <style>
      /* The colors of the window, which Cox gives every plugin as
         `cox://api/theme.css` (see `ui::theme`): the page sits on the
         stage's card, as Cox's own tabs do. Beside them, the page keeps
         to three sizes of type, one weight for names, a scale of space
         and one radius, and gives color only to how a chat stands. */
      :root {
        --sans: -apple-system, "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        --mono: Menlo, "DejaVu Sans Mono", monospace;
        --small: 11px;
        --body: 13px;
        --title: 15px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 24px;
        --radius: 6px;
        /* How far each subagent's name steps in from the chat's above,
           and how wide what folds them away is, with the space after. */
        --indent-step: 16px;
        --fold: 16px;
      }
      html,
      body {
        margin: 0;
        background: var(--surface);
        color: var(--foreground);
        font: var(--body) / 1.5 var(--sans);
      }
      #app {
        padding: var(--space-3) var(--space-4) 40px;
        box-sizing: border-box;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
      }
      /* The heading, as Cox's own tabs have it (see `stage::heading`):
         the title and, at the right edge, where it shows it from. */
      .head {
        display: flex;
        align-items: baseline;
        gap: var(--space-3);
        min-height: 26px;
        margin-bottom: var(--space-2);
        white-space: nowrap;
      }
      .head h1 {
        flex: none;
        margin: 0;
        font-size: var(--title);
        font-weight: 600;
      }
      .head .where {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: right;
        font: var(--small) var(--mono);
        color: var(--faint);
      }
      .notice {
        color: var(--dim);
        font-size: var(--small);
        margin-bottom: var(--space-2);
      }
      /* How it all stands, in three numbers, then every step of every
         plan in one bar. */
      .numbers {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--space-2);
        margin-bottom: var(--space-3);
      }
      .numbers .number {
        background: var(--pane);
        border-radius: var(--radius);
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--card-edge);
      }
      .numbers .number .count {
        font-size: var(--title);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .numbers .number .what {
        color: var(--dim);
        font-size: var(--small);
      }
      .numbers .number.yours .count {
        color: var(--asking);
      }
      .numbers .number.work .count {
        color: var(--accent);
      }
      .pick {
        font-size: var(--small);
        color: var(--faint);
        background: none;
        border: 0;
        padding: 0 2px;
        cursor: pointer;
      }
      .pick:hover {
        color: var(--link);
      }
      .pick.picked {
        color: var(--foreground);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .overall {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        color: var(--dim);
        font-size: var(--small);
        margin-bottom: var(--space-4);
        white-space: nowrap;
      }
      .overall .bar {
        flex: 1;
      }
      /* A bar of steps: one block a step. */
      .bar {
        display: flex;
        gap: 2px;
        height: 6px;
        min-width: 0;
      }
      .bar i {
        flex: 1;
        min-width: 0;
        border-radius: 2px;
        background: var(--button-hover);
      }
      .bar i.completed {
        background: var(--accent);
        opacity: 0.5;
      }
      .bar i.in_progress {
        background: var(--accent);
      }
      /* The chats, and the pull requests, as cards, in groups by what
         they need, the one that needs the human first, each group under
         its name and how many it holds. */
      #app {
        container-type: inline-size;
      }
      .section {
        margin-bottom: var(--space-4);
      }
      .section-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0 var(--space-2);
        margin-bottom: var(--space-2);
      }
      .section-head h2 {
        margin: 0;
        font-size: var(--body);
        font-weight: 600;
        white-space: nowrap;
      }
      .section-head .sum {
        font-size: var(--small);
        color: var(--faint);
      }
      .cards-group {
        margin-bottom: var(--space-3);
      }
      .group-head {
        display: flex;
        align-items: baseline;
        gap: var(--space-2);
        margin-bottom: var(--space-1);
        font-size: var(--small);
        font-weight: 600;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .group-head .n {
        font-weight: normal;
        color: var(--faint);
      }
      .cards-group.yours .group-head {
        color: var(--asking);
      }
      .cards-group.running .group-head,
      .cards-group.work .group-head {
        color: var(--link);
      }
      .cards-group.ready .group-head {
        color: var(--accent);
      }
      .cards {
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
      }
      .none {
        color: var(--dim);
        padding: var(--space-2);
      }
      /* A card, its left edge colored as what it needs. */
      .card {
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
        min-width: 0;
        padding: var(--space-2) var(--space-3);
        background: var(--pane);
        border: 1px solid var(--card-edge);
        border-left: 3px solid var(--card-edge);
        border-radius: var(--radius);
      }
      .card.pr:hover {
        background: var(--raised);
      }
      .card.yours {
        border-left-color: var(--asking);
      }
      .card.pr.yours {
        background: linear-gradient(90deg, var(--asking-ground), var(--pane) 40%);
      }
      .card.pr.yours.failed {
        border-left-color: var(--failed-mark);
        background: linear-gradient(90deg, var(--failed-ground), var(--pane) 40%);
      }
      .card.running,
      .card.work {
        border-left-color: var(--link);
      }
      .card.ready {
        border-left-color: var(--accent);
      }
      .card.rest,
      .card.done {
        background: transparent;
      }
      .l1,
      .l2 {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        min-width: 0;
      }
      .l1 .title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .l1 .meta,
      .push {
        display: flex;
        flex: none;
        align-items: center;
        gap: var(--space-2);
      }
      .l2 {
        flex-wrap: wrap;
        row-gap: var(--space-1);
      }
      .push {
        margin-left: auto;
      }
      /* A chat's card: the chat at the top on two lines, past what folds
         its subagents away, and each subagent on one, stepped in as deep
         as it is. */
      .card.tree {
        padding: 0;
        gap: 0;
      }
      .row {
        padding: var(--space-2) var(--space-3);
        cursor: pointer;
      }
      .row:hover {
        background: var(--hover);
      }
      .row.open {
        background: var(--raised);
      }
      .row.root {
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
        border-radius: var(--radius) var(--radius) 0 0;
      }
      .row.root .l2 {
        padding-left: calc(var(--fold) + var(--space-2));
      }
      .row.root .l2 .now {
        flex: 1;
      }
      .row.sub {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-1) var(--space-3);
        padding-left: calc(var(--space-3) + var(--fold) + var(--space-2) + (var(--indent) - 1) * var(--indent-step));
        border-top: 1px solid var(--border);
      }
      .row.sub .name {
        display: flex;
        flex: none;
        align-items: center;
        gap: var(--space-1);
        width: 240px;
        min-width: 0;
        white-space: nowrap;
      }
      .row.sub .name a,
      .row.sub .name .hint {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row.sub .cname {
        font-weight: normal;
      }
      .row.sub.is-done .cname,
      .row.sub.is-stopped .cname {
        color: var(--dim);
      }
      .row.sub .now {
        flex: 1;
        font-size: var(--small);
      }
      /* The chat the window shows, by a bar down its left edge. */
      .row.shown {
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .cname {
        font-weight: 600;
      }
      .cname:hover {
        color: var(--link);
      }
      .arrow {
        color: var(--disabled);
      }
      /* A step of a chat's plan that subagents came from, over them. */
      .from {
        display: flex;
        align-items: baseline;
        gap: var(--space-1);
        padding: 2px var(--space-3);
        padding-left: calc(var(--space-3) + var(--fold) + var(--space-2) + (var(--indent) - 1) * var(--indent-step));
        border-top: 1px solid var(--border);
        color: var(--faint);
        font-size: var(--small);
        min-width: 0;
      }
      .from .text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .from.in_progress .mark {
        color: var(--accent);
      }
      /* What folds away the subagents under a chat, and, while they are,
         how many there are. */
      .fold {
        flex: none;
        width: var(--fold);
        color: var(--faint);
        font-size: var(--small);
        font-weight: normal;
        text-align: left;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .fold.more {
        width: auto;
        white-space: nowrap;
      }
      .fold .ask {
        color: var(--asking);
      }
      .fold:hover {
        color: var(--foreground);
      }
      .hint {
        color: var(--faint);
        font-weight: normal;
        font-size: var(--small);
      }
      /* How a chat, or a pull request, stands, as a badge. */
      .badge {
        display: inline-flex;
        flex: none;
        align-items: center;
        padding: 0 7px;
        border: 1px solid;
        border-radius: 9px;
        font-size: var(--small);
        font-weight: 600;
        line-height: 18px;
        white-space: nowrap;
      }
      .badge.open {
        color: var(--accent);
        background: var(--accent-tint);
        border-color: var(--accent-tint-edge);
      }
      .badge.draft {
        color: var(--dim);
        border-color: var(--border-strong);
      }
      .badge.merged {
        color: var(--dim);
        background: var(--raised);
        border-color: var(--border-strong);
      }
      .badge.closed {
        color: var(--faint);
        border-color: var(--border);
        text-decoration: line-through;
      }
      .badge.ask {
        color: var(--asking);
        background: var(--asking-tint);
        border-color: var(--asking-tint-edge);
      }
      .badge.work {
        color: var(--link);
        border-color: var(--accent-tint-edge);
      }
      .badge.quiet {
        color: var(--faint);
        border-color: var(--border);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
        min-width: 0;
        font-size: var(--small);
        white-space: nowrap;
        color: var(--dim);
      }
      .chip b {
        font-weight: 600;
      }
      .chip.good {
        color: var(--accent);
      }
      .chip.ask {
        color: var(--asking);
      }
      .chip.run {
        color: var(--link);
      }
      .chip.quiet {
        color: var(--faint);
      }
      .now {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* A plan, or the checks of a pull request, as blocks of a size, and
         how far it got. */
      .ci {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: var(--space-2);
        font-size: var(--small);
        color: var(--dim);
        white-space: nowrap;
      }
      .ci .p {
        color: var(--accent);
      }
      .ci .f {
        color: var(--failed);
      }
      .ci .r {
        color: var(--link);
      }
      .blocks {
        display: inline-flex;
        gap: 2px;
        height: 6px;
        max-width: 160px;
      }
      .blocks s {
        flex: 0 1 auto;
        width: 8px;
        min-width: 2px;
        border-radius: 2px;
        background: var(--button);
      }
      .blocks s.p {
        background: var(--accent);
      }
      .blocks s.f {
        background: var(--failed-mark);
      }
      .blocks s.r {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--link);
        animation: pulse 1.4s ease-in-out infinite;
      }
      .blocks s.a {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--asking);
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .failnames {
        font-size: var(--small);
        color: var(--failed);
      }
      .failnames code {
        padding: 0 var(--space-1);
        font: var(--small) var(--mono);
        background: var(--failed-tint);
        border: 1px solid var(--failed-tint-edge);
        border-radius: 4px;
      }
      .diff {
        font: var(--small) var(--mono);
        color: var(--faint);
        white-space: nowrap;
      }
      .diff .a {
        color: var(--accent);
      }
      .diff .d {
        color: var(--failed);
      }
      .age,
      .where {
        font-size: var(--small);
        color: var(--faint);
        white-space: nowrap;
      }
      .num {
        flex: none;
        color: var(--link);
        font-variant-numeric: tabular-nums;
      }
      .num:hover,
      .chatlink:hover {
        text-decoration: underline;
      }
      .chatlink {
        font-size: var(--small);
        color: var(--link);
        white-space: nowrap;
      }
      .chatlink.done {
        color: var(--faint);
      }
      .chatlink.none {
        color: var(--disabled);
      }
      .sep {
        color: var(--disabled);
      }
      /* What asks the human to act: to answer a chat, reply to it, or
         have it fix its CI. */
      .btn {
        flex: none;
        padding: 2px var(--space-2);
        font-size: var(--small);
        font-weight: 600;
        color: var(--asking);
        background: var(--asking-ground);
        border: 1px solid var(--asking-edge);
        border-radius: var(--radius-control);
        white-space: nowrap;
        cursor: pointer;
      }
      .btn:hover {
        background: var(--asking-tint);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      /* What is folded away: the chats stopped or done, the pull
         requests merged or closed. */
      .folded summary {
        padding: var(--space-1) 0;
        font-size: var(--small);
        color: var(--faint);
        list-style: none;
        cursor: pointer;
      }
      .folded summary::-webkit-details-marker {
        display: none;
      }
      .folded summary::before {
        content: "▸ ";
        color: var(--disabled);
      }
      .folded[open] summary::before {
        content: "▾ ";
      }
      .folded summary:hover {
        color: var(--dim);
      }
      .folded .card {
        opacity: 0.7;
      }
      /* Narrow, as on a phone, a card's title goes on a line of its own,
         and what it asks to do under the rest. */
      @container (max-width: 600px) {
        .card.pr,
        .row {
          padding-left: var(--space-2);
          padding-right: var(--space-2);
        }
        .l1 {
          flex-wrap: wrap;
          row-gap: var(--space-1);
        }
        .l1 .title {
          flex-basis: 100%;
          order: 3;
          white-space: normal;
        }
        .l1 .meta {
          margin-left: auto;
        }
        .push {
          flex-wrap: wrap;
          row-gap: var(--space-1);
          width: 100%;
          margin-left: 0;
        }
        .push .btn {
          margin-left: auto;
        }
        .row.root .l2 {
          padding-left: 0;
        }
        .row.sub,
        .from {
          --indent-step: 10px;
          padding-left: calc(var(--space-2) + var(--indent) * var(--indent-step));
        }
        .row.sub {
          flex-wrap: wrap;
          row-gap: var(--space-1);
        }
        .row.sub .name {
          flex: 1 1 100%;
          width: auto;
        }
        .row.sub .now {
          flex: 1 1 auto;
        }
        .row.sub .push {
          width: auto;
        }
      }
      /* The chat opened: what it is, its story in time, how it ended, and
         its steps. */
      .opened {
        background: var(--ground);
        border-radius: var(--radius);
        padding: var(--space-2) var(--space-3) var(--space-3);
        margin: var(--space-1) var(--space-2) var(--space-2);
      }
      .meta {
        color: var(--faint);
        font-size: var(--small);
        padding-bottom: var(--space-2);
      }
      .dismiss {
        font-size: var(--small);
        color: var(--faint);
        background: none;
        border: 0;
        padding: 0;
        margin-left: var(--space-2);
        cursor: pointer;
      }
      .dismiss:hover {
        color: var(--link);
      }
      /* The story, and the steps beside it: the story the wider, as its
         lines are longer; one under the other only where the two would
         be too narrow to read. */
      .opened {
        container-type: inline-size;
      }
      .columns {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
        column-gap: var(--space-4);
        align-items: start;
      }
      .columns.alone {
        grid-template-columns: minmax(0, 1fr);
      }
      /* Narrow, its steps go under its story. */
      @container (max-width: 480px) {
        .columns {
          grid-template-columns: minmax(0, 1fr);
        }
        .columns .plan {
          margin-top: var(--space-3);
          padding-top: var(--space-2);
          border-top: 1px solid var(--border);
        }
      }
      .event,
      .end {
        display: grid;
        grid-template-columns: 44px 16px minmax(0, 1fr);
        align-items: baseline;
        column-gap: var(--space-1);
        padding: 1px 0;
      }
      .step {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr);
        align-items: baseline;
        column-gap: var(--space-1);
        padding: 1px 0;
      }
      .event .at,
      .end .at {
        font: var(--small) var(--mono);
        color: var(--faint);
        white-space: nowrap;
      }
      .event .mark,
      .end .mark,
      .step .mark {
        text-align: center;
        color: var(--faint);
        font-size: var(--small);
      }
      .event .text {
        color: var(--dim);
        overflow-wrap: anywhere;
      }
      .event .text b {
        font-weight: normal;
        color: var(--foreground);
      }
      .event.start .text,
      .event.answered .text,
      .event.running .text {
        color: var(--foreground);
      }
      .event.step_started .mark,
      .event.step_done .mark,
      .event.running .mark {
        color: var(--accent);
      }
      .event.asked .mark,
      .event.asked .text {
        color: var(--asking);
      }
      .event.plan_revised.dropped .mark,
      .event.plan_revised.dropped .text b {
        color: var(--asking);
      }
      .event .revised {
        display: block;
        font-size: var(--small);
        padding-left: var(--space-2);
        border-left: 2px solid var(--border-strong);
      }
      .event .revised .added {
        color: var(--asking);
      }
      .event .revised .removed {
        color: var(--faint);
        text-decoration: line-through;
      }
      .event.said .text {
        font-size: var(--small);
        padding-left: var(--space-2);
        border-left: 2px solid var(--border-strong);
      }
      .event.ci.failed .text,
      .event.turn_end.failed .text,
      .event.check.failed .text {
        color: var(--failed);
      }
      .event.check.failed .mark {
        color: var(--failed);
      }
      /* What a line printed, as a check that failed, a click away. */
      .event .opener {
        font-size: var(--small);
        color: var(--faint);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      .event .opener:hover {
        color: var(--link);
      }
      /* The commands of a step the agent ran that ran long or failed,
         each on a line of its own, under what it said before them: what
         it said it is for, then the command, fainter, as its gist. */
      .event.ran .said {
        color: var(--foreground);
      }
      .event.ran .lines {
        white-space: nowrap;
      }
      .event .command {
        display: flex;
        gap: var(--space-2);
        align-items: baseline;
        margin-top: 2px;
        padding: 0 var(--space-1);
        border-radius: var(--radius);
        font: var(--small) / 1.6 var(--mono);
        cursor: pointer;
      }
      .event .command:hover,
      .event .command.open {
        background: var(--accent-tint);
      }
      .event .command .ended {
        flex: none;
        color: var(--accent);
      }
      .event .command.failed .ended,
      .event .command.failed .about,
      .event .command.failed .gist {
        color: var(--failed);
      }
      .event .command.cancelled .ended {
        color: var(--faint);
      }
      .event .command .line {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .event .command .about {
        margin-right: var(--space-2);
        font: var(--body) var(--sans);
        color: var(--foreground);
      }
      .event .command .about + .gist {
        color: var(--dim);
      }
      .event .command .secs {
        flex: none;
        color: var(--faint);
      }
      .event .under {
        margin: 2px 0 var(--space-2);
        border: 1px solid var(--card-edge);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .event .under .printed {
        margin: 0;
        border: none;
        border-top: 1px solid var(--border);
        border-radius: 0;
      }
      /* A command laid out: a row for each command of a chain, after what
         joins it to the one before, in a gutter at the left edge, and its
         code indented as deep as the block it is in. */
      .laid {
        position: relative;
        padding: var(--space-1) var(--space-2);
        background: var(--ground);
        font: var(--small) / 1.55 var(--mono);
        color: var(--foreground);
      }
      .laid-row {
        display: flex;
      }
      .laid .joint {
        flex: none;
        width: calc(3ch + var(--depth) * 2ch);
        color: var(--faint);
      }
      .laid .code {
        min-width: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .piece-fold {
        display: inline-block;
        margin: 0 0.5ch;
        padding: 0 6px;
        border-radius: 4px;
        background: var(--button);
        color: var(--dim);
        font: var(--small) / 1.6 var(--sans);
        cursor: pointer;
        user-select: none;
        box-shadow: 0 0 0 1px var(--control-edge);
      }
      .piece-fold:hover {
        color: var(--foreground);
      }
      .piece-body {
        margin: 2px 0 4px calc(var(--depth, 0) * 2ch + 3ch);
        padding: 2px 0 2px 10px;
        border-left: 2px solid var(--border);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--dim);
      }
      .laid .copy {
        position: absolute;
        top: 4px;
        right: 6px;
        padding: 1px 8px;
        border: 1px solid var(--control-edge);
        border-radius: 4px;
        background: var(--button);
        color: var(--dim);
        font: var(--small) var(--sans);
        cursor: pointer;
        opacity: 0;
        box-shadow: var(--control-shadow);
      }
      .laid:hover .copy {
        opacity: 1;
      }
      .laid .copy:hover {
        color: var(--foreground);
      }
      /* The code's colors, as the code tabs draw them (and the Map). */
      .hl-keyword,
      .hl-variable-builtin,
      .hl-tag,
      .hl-punctuation-special {
        color: #569cd6;
      }
      .hl-function {
        color: #dcdcaa;
      }
      .hl-type,
      .hl-type-builtin,
      .hl-constructor {
        color: #4ec9b0;
      }
      .hl-string,
      .hl-literal {
        color: #ce9178;
      }
      .hl-string-special,
      .hl-escape {
        color: #d7ba7d;
      }
      .hl-number,
      .hl-constant-builtin {
        color: #b5cea8;
      }
      .hl-comment {
        color: #6a9955;
      }
      .hl-constant,
      .hl-uri {
        color: #4fc1ff;
      }
      .hl-property,
      .hl-variable {
        color: #9cdcfe;
      }
      .hl-attribute,
      .hl-label {
        color: #c586c0;
      }
      /* What sets up the environment, as `CARGO_TARGET_DIR=…`, which the
         eye can pass over. */
      .hl-quiet {
        color: var(--faint);
      }
      .event .printed {
        margin: var(--space-1) 0 var(--space-2);
        padding: var(--space-1) var(--space-2);
        max-height: 240px;
        overflow: auto;
        font: var(--small) / 1.5 var(--mono);
        color: var(--dim);
        background: var(--inset-ground);
        border: 1px solid var(--card-edge);
        border-radius: var(--radius);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .event .lines,
      .event .number {
        font: var(--small) var(--mono);
      }
      .event .lines {
        color: var(--faint);
      }
      .event .number {
        color: var(--link);
      }
      .event .text a {
        color: var(--link);
      }
      /* The day the lines under it are of, where it changes, as the
         column of times has room for the time of day alone. */
      .day {
        font: var(--small) var(--mono);
        color: var(--faint);
        padding: var(--space-1) 0 1px;
      }
      .day:first-child {
        padding-top: 0;
      }
      .day.ending {
        margin-top: var(--space-1);
        padding-top: var(--space-2);
        border-top: 1px solid var(--border);
      }
      .day.ending + .end {
        margin-top: 0;
        padding-top: 1px;
        border-top: none;
      }
      .end {
        margin-top: var(--space-1);
        padding-top: var(--space-2);
        border-top: 1px solid var(--border);
      }
      .end .at {
        color: var(--foreground);
      }
      .end .how {
        font-weight: 600;
      }
      .end .how span {
        font-weight: normal;
        color: var(--dim);
      }
      .end.work .mark,
      .end.work .how,
      .end.done .mark,
      .end.done .how {
        color: var(--accent);
      }
      .end.yours .mark,
      .end.yours .how {
        color: var(--asking);
      }
      .end.failed .mark,
      .end.failed .how {
        color: var(--failed);
      }
      .plan .count {
        font-size: var(--small);
        color: var(--faint);
        padding-bottom: var(--space-1);
      }
      .step .text {
        overflow-wrap: anywhere;
      }
      .step.completed .text {
        color: var(--dim);
      }
      .step.in_progress .mark {
        color: var(--accent);
      }
      /* A step opens its thread with a click. */
      .opens {
        cursor: pointer;
      }
      .opens:hover,
      .opens.shown {
        color: var(--link);
      }
      .on {
        color: var(--faint);
        font-size: var(--small);
      }
      .thread {
        margin: var(--space-1) 0 var(--space-2);
        padding: var(--space-2);
        border: 1px solid var(--card-edge);
        border-radius: var(--radius);
        font-size: var(--small);
        background: var(--pane);
      }
      .thread .said {
        padding: 2px 0;
      }
      .thread .by {
        display: block;
        color: var(--faint);
      }
      .thread .says {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: var(--body);
      }
      .thread .agent .says,
      .thread .waiting .says {
        color: var(--dim);
      }
      .thread .waiting .says {
        font-style: italic;
      }
      .thread .write {
        display: flex;
        gap: var(--space-1);
        margin-top: var(--space-1);
      }
      .thread textarea {
        flex: 1;
        font: inherit;
        font-size: var(--body);
        color: var(--foreground);
        background: var(--inset-ground);
        border: 1px solid var(--inset-edge);
        border-radius: var(--radius-input);
        padding: var(--space-1) var(--space-2);
        resize: vertical;
        box-shadow: var(--inset-shadow);
      }
      .thread textarea:focus {
        outline: none;
        box-shadow: var(--inset-shadow), var(--focus-ring);
      }
      .thread button {
        color: var(--link);
        background: var(--button);
        border: 1px solid var(--control-edge);
        border-radius: var(--radius);
        cursor: pointer;
        box-shadow: var(--control-shadow);
      }
      .thread :disabled {
        opacity: 0.5;
        cursor: default;
      }
      .thread .why {
        color: var(--dim);
        margin-top: var(--space-1);
      }
      .pull {
        font-size: var(--small);
        color: var(--dim);
        margin-left: 48px;
      }
      .pull .number {
        font-family: var(--mono);
        color: var(--link);
      }
      .pull .pci.running {
        color: var(--link);
      }
      .pull .pci.passed {
        color: var(--accent);
      }
      .pull .pci.failed {
        color: var(--failed);
      }
      .background {
        font-size: var(--small);
        color: var(--dim);
        margin-left: 48px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="app.js"></script>
  </body>
</html>
