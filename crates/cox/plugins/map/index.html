<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Map</title>
    <style>
      :root {
        color-scheme: dark;
        --foreground: #d4d4d4;
        --background: #1e1e1e;
        --card: #252628;
        --card-hover: #2c2e31;
        --focus: #212121;
        --dim: #9a9a9a;
        --faint: #6e6e6e;
        --link: #7fb4ff;
        --border: #3a3b3e;
        --line: #8a8a8a;
        --changed: #e5a85a;
        --stale: #e07070;
        --note: #c9a7ff;
        --hold: #6cb8ff;
        --sans: -apple-system, "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        --mono: Menlo, "DejaVu Sans Mono", monospace;
      }
      html,
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font: 13px/1.45 var(--sans);
      }
      #app {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 100vh;
        padding: 10px 16px 32px;
        box-sizing: border-box;
      }
      button {
        all: unset;
      }
      .crumbs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--dim);
      }
      .crumbs button {
        cursor: pointer;
        color: var(--foreground);
        border-radius: 4px;
        padding: 1px 6px;
      }
      .crumbs button:hover,
      .crumbs button:focus-visible {
        background: #404040;
      }
      .crumbs .here {
        color: var(--foreground);
        font-weight: 600;
        padding: 1px 6px;
      }
      .crumbs .depth {
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--faint);
        margin-right: 2px;
      }
      .source {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        align-items: baseline;
        font-size: 12px;
        color: var(--dim);
      }
      .source .file {
        font-family: var(--mono);
        color: var(--foreground);
      }
      .source .since {
        color: var(--changed);
      }
      .says {
        font-size: 13px;
        color: var(--dim);
        max-width: 72em;
      }
      .says.failed {
        color: var(--stale);
      }
      .says.empty {
        padding: 24px 0;
        color: var(--foreground);
      }
      .says.empty code {
        font-family: var(--mono);
        font-size: 12px;
      }
      /* The tier: its rows of cards, with the frame of the tiers above beside it. */
      .drill {
        position: relative;
        display: grid;
        grid-template-columns: 104px minmax(0, 1fr) 104px;
        gap: 0 40px;
        align-items: stretch;
      }
      .drill.noframe {
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
      }
      .drill svg.wires,
      .drill svg.labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: visible;
        color: var(--line);
      }
      .drill svg.wires path,
      .line svg.wires path {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.3;
      }
      .drill svg.labels text,
      .line svg.labels text {
        font: 10.5px var(--sans);
        fill: var(--dim);
        paint-order: stroke;
        stroke: var(--background);
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      .focus svg.labels text {
        stroke: var(--focus);
      }
      .side {
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        gap: 28px;
        padding: 20px 0;
        min-width: 0;
      }
      .side.left:has(.part:only-child) {
        justify-content: flex-start;
        padding-top: 56px;
      }
      .side .part {
        width: 100%;
        max-width: none;
        min-width: 0;
        flex: 0 0 auto;
      }
      .focus {
        border: 1px solid var(--dim);
        border-radius: 12px;
        padding: 10px 10px 12px;
        display: grid;
        gap: 14px;
        background: var(--focus);
        min-width: 0;
      }
      .noframe .focus {
        border: none;
        background: transparent;
        padding: 4px 0;
      }
      .noframe .part {
        min-width: 110px;
      }
      .focushead {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .focushead .name {
        font-size: 15px;
        font-weight: 600;
      }
      .focushead .open {
        margin-left: auto;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--dim);
      }
      .row {
        display: grid;
        gap: 6px;
      }
      .row .rowname {
        font-size: 11.5px;
        color: var(--dim);
        letter-spacing: 0.04em;
      }
      .line {
        position: relative;
        display: flex;
        flex-wrap: nowrap;
        align-items: stretch;
        gap: 6px 4px;
        overflow-x: auto;
        scrollbar-width: none;
        padding: 2px 2px 12px;
      }
      .line::-webkit-scrollbar {
        display: none;
      }
      .line svg.wires,
      .line svg.labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
        color: var(--line);
      }
      .line .gap {
        flex: 0 0 auto;
      }
      .line .space {
        flex: 0 0 14px;
      }
      /* A card. */
      .part {
        box-sizing: border-box;
        display: grid;
        gap: 4px;
        align-content: start;
        flex: 1 1 150px;
        min-width: 140px;
        max-width: 210px;
        padding: 9px 11px;
        border-radius: 8px;
        background: var(--card);
        border: 1px solid var(--border);
        color: inherit;
      }
      .part.goes {
        cursor: pointer;
      }
      .part.goes:hover,
      .part.goes:focus-visible {
        border-color: var(--dim);
        background: var(--card-hover);
      }
      .part.many {
        box-shadow:
          4px 4px 0 -1px var(--focus),
          4px 4px 0 0 var(--border);
        margin-right: 4px;
        margin-bottom: 4px;
      }
      .part.lit {
        border-color: var(--changed);
        box-shadow: inset 0 0 0 1px rgba(229, 168, 90, 0.25);
      }
      .part.lit.many {
        box-shadow:
          inset 0 0 0 1px rgba(229, 168, 90, 0.25),
          4px 4px 0 -1px var(--focus),
          4px 4px 0 0 var(--border);
      }
      .part.stale {
        border-style: dashed;
      }
      .part.outer {
        font-size: 12px;
      }
      .part .pname {
        font-size: 14px;
        font-weight: 500;
        line-height: 1.3;
      }
      .part .each {
        font-size: 10.5px;
        color: var(--dim);
        letter-spacing: 0.04em;
        justify-self: start;
        white-space: nowrap;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0 7px;
      }
      .part.many .each {
        color: var(--foreground);
      }
      .part .psays {
        font-size: 12px;
        color: var(--dim);
        line-height: 1.45;
      }
      .part .kinds {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
      }
      .part .badge {
        font-size: 11px;
        color: var(--changed);
        font-family: var(--mono);
      }
      .part .gone {
        font-size: 11px;
        color: var(--stale);
        display: grid;
        gap: 2px;
      }
      .part .gone b {
        font-weight: 500;
      }
      .part .note {
        font-size: 11px;
        color: var(--note);
        display: grid;
        gap: 2px;
      }
      .part .note b {
        font-weight: 500;
      }
      .part .holds {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        margin-top: 2px;
      }
      .part .holds .chip {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--hold);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0 5px;
        line-height: 1.5;
      }
      .part .holds .chip.hot {
        color: var(--changed);
        border-color: rgba(229, 168, 90, 0.5);
      }
      .part .holds .chip.missing {
        color: var(--stale);
        text-decoration: line-through;
      }
      .part .go {
        font-size: 11.5px;
        color: var(--link);
        justify-self: end;
      }
      /* A box on its own: the code it holds. */
      .leaf {
        display: grid;
        gap: 10px;
      }
      .hold {
        display: grid;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 11px;
        background: var(--card);
        color: inherit;
        min-width: 0;
      }
      .hold.lit {
        border-color: var(--changed);
      }
      .hold.missing {
        border-style: dashed;
      }
      .hold .head {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        align-items: baseline;
      }
      .hold .path {
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--foreground);
        text-decoration: none;
      }
      a.path:hover {
        text-decoration: underline;
      }
      .hold a.path {
        color: var(--link);
      }
      .hold .path .ln {
        color: var(--dim);
      }
      /* What the language server says of a file. */
      .outline {
        display: grid;
        gap: 5px;
        min-width: 0;
      }
      .outline .lsp {
        font-size: 11px;
        color: var(--dim);
      }
      .outline .faint,
      .usedby.faint {
        color: var(--faint);
      }
      .outline .failed {
        color: var(--stale);
      }
      .symbols {
        display: grid;
        gap: 1px;
        min-width: 0;
      }
      .sym {
        min-width: 0;
      }
      .sym a {
        display: flex;
        gap: 8px;
        align-items: baseline;
        text-decoration: none;
        color: inherit;
        font-family: var(--mono);
        font-size: 11.5px;
        padding: 1px 4px;
        border-radius: 4px;
        min-width: 0;
      }
      .sym a:hover {
        background: var(--card-hover);
      }
      .sym.here > a {
        background: rgba(229, 168, 90, 0.12);
      }
      .sym .ln {
        color: var(--faint);
        min-width: 3ch;
        text-align: right;
        font-size: 10.5px;
        flex: 0 0 auto;
      }
      .sym .kind {
        color: var(--dim);
        font-size: 10.5px;
        flex: 0 0 auto;
      }
      .sym .name {
        color: var(--foreground);
      }
      .sym .detail {
        color: var(--hold);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .sym .n,
      .sym .uses {
        margin-left: auto;
        color: var(--dim);
        font-size: 10.5px;
        white-space: nowrap;
        font-family: var(--sans);
        flex: 0 0 auto;
      }
      .sym .n + .uses {
        margin-left: 0;
      }
      .sym .uses.zero {
        color: var(--faint);
      }
      .sym .within {
        margin-left: 18px;
        border-left: 1px solid var(--border);
        padding-left: 6px;
      }
      .usedby {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        font-size: 11px;
        color: var(--dim);
        align-items: baseline;
      }
      .usedby b {
        font-weight: 500;
      }
      .usedby a {
        color: var(--link);
        text-decoration: none;
        font-family: var(--mono);
      }
      .usedby a:hover {
        text-decoration: underline;
      }
      .usedby .n {
        color: var(--faint);
        margin-left: 2px;
      }
      .hold .n {
        font-size: 11.5px;
        color: var(--dim);
      }
      .hold .badge {
        font-size: 11px;
        color: var(--changed);
        font-family: var(--mono);
      }
      .hold .missing {
        font-size: 11px;
        color: var(--stale);
      }
      .foot {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        font-size: 11.5px;
        color: var(--faint);
        margin-top: auto;
      }
      @container (max-width: 640px) {
        .drill {
          grid-template-columns: 1fr;
          gap: 28px 0;
        }
        .side {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
          padding: 0;
          gap: 10px;
        }
        .side .part {
          width: auto;
          min-width: 120px;
        }
      }
      #app {
        container-type: inline-size;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
