<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Map</title>
    <style>
      /* The colors of the window (see `ui::theme`): the page sits on the
         stage's card, as Cox's own tabs do, and the accent marks what
         changed, as it does there. */
      :root {
        color-scheme: dark;
        --foreground: #e4e4e6;
        --background: #151517;
        --card: #17171a;
        --card-hover: #1f1f23;
        --focus: #1a1a1d;
        --dim: #a5a5ab;
        --faint: #8e8e95;
        --link: #a6ebe1;
        --border: #2c2c31;
        --line: #6a6a72;
        --hover: #222226;
        --changed: #6fd3c5;
        --changed-ground: #13211f;
        --changed-edge: #5cbfb1;
        --on-accent: #08201c;
        --stale: #ec8580;
        --note: #a5a5ab;
        --hold: #6fd3c5;
        --sans: -apple-system, "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        --mono: Menlo, "DejaVu Sans Mono", monospace;
      }
      html,
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font: 13px/1.45 var(--sans);
      }
      #app {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 100vh;
        padding: 12px 16px 32px;
        box-sizing: border-box;
      }
      /* The heading, as Cox's own tabs have it (see `stage::heading`):
         the title, a line on what the tab shows, and, at the right
         edge, where it shows it from. */
      #app > .head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 4px;
        min-height: 26px;
        margin-bottom: -4px;
        white-space: nowrap;
      }
      #app > .head h1 {
        flex: none;
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      #app > .head .summary {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--dim);
      }
      #app > .head .since {
        color: var(--changed);
      }
      /* What follows the heading outside the cards, in line with it. */
      #app > .maps,
      #app > .crumbs,
      #app > .says,
      #app > .flows {
        padding-left: 4px;
        padding-right: 4px;
      }
      #app > .head .where {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: right;
        font: 11.5px var(--mono);
        color: var(--faint);
      }
      button {
        all: unset;
      }
      /* The project's maps, each a picture of it from a top of its own,
         the one shown lit, as tabs over the page. */
      .maps {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }
      .mapsname {
        font-size: 10.5px;
        color: var(--faint);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-right: 2px;
      }
      .mapchip {
        font: 12.5px var(--sans);
        color: var(--dim);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 10px;
        cursor: pointer;
      }
      .mapchip:hover,
      .mapchip:focus-visible {
        color: var(--foreground);
        background: var(--hover);
      }
      .mapchip.on {
        color: var(--foreground);
        font-weight: 600;
        background: var(--card-hover);
        border-color: var(--dim);
      }
      .crumbs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--dim);
      }
      .crumbs button {
        cursor: pointer;
        color: var(--foreground);
        border-radius: 4px;
        padding: 1px 6px;
      }
      .crumbs button:hover,
      .crumbs button:focus-visible {
        background: var(--hover);
      }
      .crumbs .here {
        color: var(--foreground);
        font-weight: 600;
        padding: 1px 6px;
      }
      .crumbs .depth {
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--faint);
        margin-right: 2px;
      }
      /* The ways out of the page, over what it shows: back to where it
         was, up a tier, forward again, each naming where it goes. */
      .waybar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 10px;
      }
      .wayto {
        font: 12.5px var(--sans);
        color: var(--foreground);
        background: var(--card);
        border: 1px solid var(--dim);
        border-radius: 8px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .wayto b {
        font-weight: 600;
      }
      .wayto:hover,
      .wayto:focus-visible {
        background: var(--card-hover);
        border-color: var(--foreground);
      }
      .legend .name[data-goes],
      .seq .box .name[data-goes] {
        cursor: pointer;
      }
      .legend .name[data-goes]:hover,
      .seq .box .name[data-goes]:hover {
        text-decoration: underline;
      }
      .upmark {
        color: var(--link);
        fill: var(--link);
        font-weight: 400;
      }
      .says {
        font-size: 13px;
        color: var(--dim);
        max-width: 72em;
      }
      .says.failed {
        color: var(--stale);
      }
      .says.empty {
        padding: 24px 0;
        color: var(--foreground);
      }
      .says.empty code {
        font-family: var(--mono);
        font-size: 12px;
      }
      /* The tier: its rows of cards, with the frame of the tiers above around it, above and below. */
      .drill {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
      }
      .drill svg.wires,
      .drill svg.labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: visible;
        color: var(--line);
      }
      /* The labels and the flow's badges go over the row names and the legend. */
      .drill svg.labels,
      .line svg.labels {
        z-index: 2;
      }
      .drill svg.wires path,
      .line svg.wires path {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.3;
      }
      .drill svg.labels text,
      .line svg.labels text {
        font: 10.5px var(--sans);
        fill: var(--dim);
        paint-order: stroke;
        stroke: var(--background);
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      .focus svg.labels text {
        stroke: var(--focus);
      }
      /* A flow over the lines: its own lines dashed, the step chosen lit, the rest dimmed. */
      svg.wires path.flow {
        stroke-dasharray: 4 3;
      }
      svg.wires path.lit {
        stroke: var(--hold);
        stroke-width: 2;
      }
      svg.wires path.off,
      svg.labels text.off {
        opacity: 0.3;
      }
      svg.labels g.badge circle {
        fill: var(--background);
        stroke: var(--line);
        stroke-width: 1.2;
      }
      svg.labels g.badge text {
        font: 600 9.5px var(--sans);
        fill: var(--foreground);
        stroke: none;
      }
      svg.labels g.badge.lit circle {
        fill: var(--hold);
        stroke: var(--hold);
      }
      svg.labels g.badge.lit text {
        fill: var(--on-accent);
      }
      .flows {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin: 0 0 8px;
      }
      .flowsname {
        font-size: 10.5px;
        color: var(--faint);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-right: 2px;
      }
      .flowchip {
        display: inline-block;
        box-sizing: border-box;
        font: 12px var(--sans);
        color: var(--dim);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 10px;
        cursor: pointer;
      }
      .flowchip:hover,
      .flowchip.on {
        color: var(--foreground);
        border-color: var(--dim);
      }
      .flowchip.on {
        background: var(--card);
      }
      .steps {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 6px;
      }
      .step {
        display: inline-grid;
        place-items: center;
        box-sizing: border-box;
        font: 600 10.5px var(--sans);
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--background);
        color: var(--foreground);
        cursor: pointer;
        padding: 0;
      }
      .step.inside,
      .step.own {
        border-style: dashed;
      }
      .step.outside {
        border-color: var(--border);
        color: var(--faint);
      }
      .step:hover {
        border-color: var(--foreground);
      }
      .step.on {
        background: var(--hold);
        border-color: var(--hold);
        color: var(--on-accent);
      }
      .stepsays {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px;
        font-size: 12.5px;
        margin-bottom: 10px;
      }
      .stepsays .n {
        font-weight: 600;
        color: var(--hold);
      }
      .stepsays .what {
        color: var(--dim);
      }
      .stepsays .where,
      .stepsays.faint {
        color: var(--dim);
      }
      .stepsays .where {
        font-size: 11.5px;
        color: var(--faint);
      }
      .stepsays .into {
        display: inline-block;
        font: 11.5px var(--sans);
        color: var(--link);
        background: transparent;
        border: none;
        padding: 0;
        cursor: pointer;
      }
      .stepsays .fn {
        font-family: var(--mono);
      }
      .stepsays .where.stale {
        color: var(--stale);
      }
      .stepsays .at {
        font: 11px var(--mono);
        color: var(--hold);
        text-decoration: none;
      }
      .views {
        display: inline-flex;
        margin-left: auto;
        border: 1px solid var(--border);
        border-radius: 999px;
        overflow: hidden;
      }
      .view {
        display: inline-block;
        font: 11.5px var(--sans);
        color: var(--dim);
        padding: 2px 10px;
        cursor: pointer;
      }
      .view:hover {
        color: var(--foreground);
      }
      .view.on {
        background: var(--card);
        color: var(--foreground);
      }
      /* A flow in order: the boxes as columns with lifelines, the steps as rows. */
      .seq {
        overflow-x: auto;
        color: var(--line);
      }
      .seq svg {
        display: block;
        font-family: var(--sans);
      }
      .seq .box rect {
        fill: var(--focus);
        stroke: var(--dim);
      }
      .seq .box .name {
        font-size: 13px;
        font-weight: 600;
        fill: var(--foreground);
        paint-order: stroke;
        stroke: var(--background);
        stroke-width: 6px;
        stroke-linejoin: round;
      }
      /* A frame of a tier above, around the one open. */
      .seq .box.outer rect {
        fill: none;
        stroke-dasharray: 4 4;
      }
      .seq .box.outer .name {
        fill: var(--dim);
      }
      .seq .box .each {
        font-size: 10.5px;
        fill: var(--dim);
        letter-spacing: 0.04em;
        paint-order: stroke;
        stroke: var(--background);
        stroke-width: 6px;
        stroke-linejoin: round;
      }
      .seq .life {
        stroke: var(--border);
        stroke-dasharray: 3 4;
      }
      .seq .who rect {
        fill: var(--card);
        stroke: var(--border);
      }
      .seq .who.own rect {
        stroke-dasharray: 3 3;
      }
      .seq .who.far rect {
        fill: none;
      }
      .seq .who.far .name {
        fill: var(--dim);
      }
      /* A function the flow runs, as a column of the box that holds it. */
      .seq .who.fn .name {
        font-family: var(--mono);
        font-size: 12px;
      }
      .seq .fnlink {
        text-decoration: none;
      }
      .seq .who.goes {
        cursor: pointer;
      }
      .seq .who.goes:hover rect {
        fill: var(--card-hover);
        stroke: var(--dim);
      }
      .seq .who .name {
        font-size: 12.5px;
        font-weight: 500;
        fill: var(--foreground);
      }
      .seq .who .each {
        font-size: 10px;
        fill: var(--dim);
      }
      .seq .row {
        cursor: pointer;
      }
      /* The code a step is made at, shown while the mouse rests on it. */
      .peek {
        position: fixed;
        z-index: 20;
        max-width: min(620px, calc(100vw - 16px));
        padding: 7px 10px 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--foreground);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
        font-size: 11.5px;
      }
      .peek .head {
        font-weight: 500;
      }
      .peek .head .n {
        display: inline-block;
        min-width: 16px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--hold);
        color: var(--background);
        font-size: 10px;
        text-align: center;
      }
      .peek .where {
        margin-top: 2px;
        color: var(--dim);
      }
      .peek .where .at,
      .peek .where b {
        font-family: var(--mono);
        font-weight: 500;
        color: var(--foreground);
        text-decoration: none;
      }
      .peek .where a.at:hover {
        text-decoration: underline;
      }
      .peek pre {
        margin: 6px -10px -8px;
        padding: 4px 0 6px;
        border-top: 1px solid var(--border);
        font-family: var(--mono);
        font-size: 11px;
        line-height: 1.45;
        overflow: hidden;
      }
      .peek .ln {
        display: block;
        padding: 0 10px;
        white-space: pre;
        color: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      .peek .ln:hover {
        background: color-mix(in srgb, var(--foreground) 9%, transparent);
      }
      .peek .ln:hover .no {
        color: var(--link);
      }
      .peek .ln .no {
        display: inline-block;
        width: 34px;
        margin-right: 10px;
        color: var(--dim);
        text-align: right;
        user-select: none;
      }
      .peek .ln.within {
        opacity: 0.72;
        background: color-mix(in srgb, var(--foreground) 4%, transparent);
      }
      .peek .ln.within:hover {
        opacity: 1;
      }
      .peek .ln.within:has(+ .ln:not(.within)) {
        border-bottom: 1px solid color-mix(in srgb, var(--foreground) 14%, transparent);
      }
      .peek .ln.at {
        background: color-mix(in srgb, var(--hold) 14%, transparent);
      }
      .peek .ln.at .no {
        color: var(--link);
      }
      .peek .ln.faint {
        color: var(--dim);
      }
      /* The code's colors, as the code tabs draw them. */
      .peek .hl-keyword,
      .peek .hl-variable-builtin,
      .peek .hl-tag,
      .peek .hl-heading,
      .peek .hl-punctuation-special {
        color: #569cd6;
      }
      .peek .hl-function {
        color: #dcdcaa;
      }
      .peek .hl-type,
      .peek .hl-type-builtin,
      .peek .hl-constructor {
        color: #4ec9b0;
      }
      .peek .hl-string,
      .peek .hl-literal {
        color: #ce9178;
      }
      .peek .hl-string-special,
      .peek .hl-escape {
        color: #d7ba7d;
      }
      .peek .hl-number,
      .peek .hl-constant-builtin {
        color: #b5cea8;
      }
      .peek .hl-comment {
        color: #6a9955;
      }
      .peek .hl-constant,
      .peek .hl-uri {
        color: #4fc1ff;
      }
      .peek .hl-property,
      .peek .hl-variable,
      .peek .hl-link {
        color: #9cdcfe;
      }
      .peek .hl-attribute,
      .peek .hl-label {
        color: #c586c0;
      }
      .peek .hl-heading,
      .peek .hl-strong {
        font-weight: 600;
      }
      .peek .hl-emphasis {
        font-style: italic;
      }
      .seq .what.fn {
        font-family: var(--mono);
        font-size: 10.5px;
      }
      .seq .fnlink:hover .what {
        text-decoration: underline;
      }
      .seq .band {
        fill: var(--hold);
        opacity: 0;
      }
      .seq .row:hover .band {
        opacity: 0.06;
      }
      .seq .row.on .band {
        opacity: 0.12;
      }
      .seq .arrow {
        fill: none;
        stroke: var(--line);
        stroke-width: 1.3;
      }
      .seq .arrow.loop,
      .seq .arrow.back {
        stroke-dasharray: 4 3;
      }
      .seq .act {
        fill: var(--card-hover);
        stroke: var(--line);
        stroke-width: 1;
      }
      .seq .row.on .arrow {
        stroke: var(--hold);
        stroke-width: 2;
      }
      .seq .what {
        font-size: 11px;
        fill: var(--foreground);
        paint-order: stroke;
        stroke: var(--background);
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      .seq .row.on .what {
        fill: var(--hold);
      }
      .seq .row.outside .what {
        font-size: 10.5px;
        fill: var(--faint);
      }
      .seq .row.outside.on .what {
        fill: var(--hold);
      }
      .seq .into {
        font-size: 11px;
        fill: var(--link);
      }
      /* A loop opens where its step is drawn apart. */
      .seq .drill {
        cursor: pointer;
      }
      .seq .drill:hover .arrow {
        stroke: var(--hold);
      }
      .seq .drill:hover .what {
        text-decoration: underline;
      }
      .seq .n rect {
        fill: var(--background);
        stroke: var(--line);
        stroke-width: 1.2;
      }
      .seq .n text {
        font: 600 9.5px var(--sans);
        fill: var(--foreground);
        text-anchor: middle;
      }
      .seq .row.outside .n rect {
        stroke: var(--border);
      }
      .seq .row.outside .n text {
        fill: var(--faint);
      }
      .seq .row.on .n rect {
        fill: var(--hold);
        stroke: var(--hold);
      }
      .seq .row.on .n text {
        fill: var(--on-accent);
      }
      .side {
        min-width: 0;
      }
      .side.above {
        padding-bottom: 22px;
      }
      .side.below {
        padding-top: 22px;
      }
      .side .line {
        padding-left: 12px;
        padding-right: 12px;
      }
      .side .part {
        flex-basis: 120px;
        min-width: 120px;
      }
      .focus {
        border: 1px solid var(--dim);
        border-radius: 12px;
        padding: 10px 10px 12px;
        display: grid;
        gap: 14px;
        background: var(--focus);
        min-width: 0;
      }
      .noframe .focus {
        border: none;
        background: transparent;
        padding: 4px 0;
      }
      .noframe .part {
        min-width: 110px;
      }
      /* The box the tier is the inside of, named over the focus's top border. */
      .legend {
        position: relative;
        z-index: 1;
        top: -20px;
        margin-bottom: -32px;
        justify-self: start;
        max-width: 50%;
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 0 6px;
        line-height: 18px;
        background: var(--background);
        white-space: nowrap;
      }
      .legend .name {
        font-size: 13px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .legend .each {
        font-size: 10.5px;
        color: var(--dim);
        letter-spacing: 0.04em;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0 7px;
      }
      .noframe .legend {
        position: static;
        margin-bottom: 0;
        padding: 0;
        background: transparent;
      }
      .noframe .legend .name {
        font-size: 15px;
      }
      .row {
        display: grid;
        gap: 6px;
      }
      .row .rowname {
        font-size: 11.5px;
        color: var(--dim);
        letter-spacing: 0.04em;
        position: relative;
        z-index: 1;
        justify-self: start;
        padding-right: 6px;
        background: var(--background);
      }
      .focus:not(.noframe .focus) .rowname {
        background: var(--focus);
      }
      .line {
        position: relative;
        display: flex;
        flex-wrap: nowrap;
        align-items: stretch;
        gap: 6px 4px;
        overflow-x: auto;
        scrollbar-width: none;
        padding: 2px 2px 12px;
      }
      .line::-webkit-scrollbar {
        display: none;
      }
      .line svg.wires,
      .line svg.labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
        color: var(--line);
      }
      .line .gap {
        flex: 0 0 auto;
      }
      .line .space {
        flex: 0 0 14px;
      }
      /* A card. */
      .part {
        box-sizing: border-box;
        display: grid;
        gap: 4px;
        align-content: start;
        flex: 1 1 150px;
        min-width: 140px;
        max-width: 210px;
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--card);
        border: 1px solid var(--border);
        color: inherit;
      }
      .part.goes {
        cursor: pointer;
      }
      .part.goes:hover,
      .part.goes:focus-visible {
        border-color: var(--dim);
        background: var(--card-hover);
      }
      .part.many {
        box-shadow:
          4px 4px 0 -1px var(--focus),
          4px 4px 0 0 var(--border);
        margin-right: 4px;
        margin-bottom: 4px;
      }
      .part.lit {
        background: var(--changed-ground);
        border-color: var(--changed-edge);
        box-shadow:
          inset 0 0 0 0.5px var(--changed-edge),
          0 0 0 5px rgba(111, 211, 197, 0.07);
      }
      .part.lit.many {
        box-shadow:
          inset 0 0 0 0.5px var(--changed-edge),
          0 0 0 5px rgba(111, 211, 197, 0.07),
          4px 4px 0 -1px var(--focus),
          4px 4px 0 0 var(--border);
      }
      .part.stale {
        border-style: dashed;
      }
      .part.outer {
        font-size: 12px;
      }
      .part .pname {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.3;
      }
      .part .each {
        font-size: 10.5px;
        color: var(--dim);
        letter-spacing: 0.04em;
        justify-self: start;
        white-space: nowrap;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0 7px;
      }
      .part.many .each {
        color: var(--foreground);
      }
      .part .psays {
        font-size: 12px;
        color: var(--dim);
        line-height: 1.45;
      }
      .part .kinds {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
      }
      .part .badge {
        font-size: 11px;
        color: var(--changed);
        font-family: var(--mono);
      }
      .part .gone {
        font-size: 11px;
        color: var(--stale);
        display: grid;
        gap: 2px;
      }
      .part .gone b {
        font-weight: 500;
      }
      .part .note {
        font-size: 11px;
        color: var(--note);
        display: grid;
        gap: 2px;
      }
      .part .note b {
        font-weight: 500;
        color: var(--foreground);
      }
      .part .holds {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        margin-top: 2px;
      }
      .part .holds .chip {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--dim);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0 5px;
        line-height: 1.5;
      }
      .part .holds .chip.hot {
        color: var(--changed);
        border-color: rgba(111, 211, 197, 0.5);
      }
      .part .holds .chip.missing {
        color: var(--stale);
        text-decoration: line-through;
      }
      .part .go {
        font-size: 11.5px;
        color: var(--link);
        justify-self: end;
      }
      /* A box on its own: the code it holds. */
      .leaf {
        display: grid;
        gap: 10px;
      }
      .hold {
        display: grid;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 11px;
        background: var(--card);
        color: inherit;
        min-width: 0;
      }
      .hold.lit {
        border-color: var(--changed);
      }
      .hold.missing {
        border-style: dashed;
      }
      .hold .head {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        align-items: baseline;
      }
      .hold .path {
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--foreground);
        text-decoration: none;
      }
      a.path:hover {
        text-decoration: underline;
      }
      .hold a.path {
        color: var(--link);
      }
      .hold .path .ln {
        color: var(--dim);
      }
      /* What the language server says of a file. */
      .outline {
        display: grid;
        gap: 5px;
        min-width: 0;
      }
      .outline .lsp {
        font-size: 11px;
        color: var(--dim);
      }
      .outline .faint,
      .usedby.faint {
        color: var(--faint);
      }
      .outline .failed {
        color: var(--stale);
      }
      .symbols {
        display: grid;
        gap: 1px;
        min-width: 0;
      }
      .sym {
        min-width: 0;
      }
      .sym a {
        display: flex;
        gap: 8px;
        align-items: baseline;
        text-decoration: none;
        color: inherit;
        font-family: var(--mono);
        font-size: 11.5px;
        padding: 1px 4px;
        border-radius: 4px;
        min-width: 0;
      }
      .sym a:hover {
        background: var(--card-hover);
      }
      .sym.here > a {
        background: rgba(111, 211, 197, 0.12);
      }
      /* A function the flow chosen runs. */
      .sym.flow > a .name,
      .sym.flow > a .detail {
        color: var(--hold);
      }
      .sym .onflow {
        color: var(--hold);
        font-family: var(--sans);
        font-size: 10px;
        border: 1px solid var(--hold);
        border-radius: 999px;
        padding: 0 6px;
        flex: 0 0 auto;
      }
      .sym .ln {
        color: var(--faint);
        min-width: 3ch;
        text-align: right;
        font-size: 10.5px;
        flex: 0 0 auto;
      }
      .sym .kind {
        color: var(--dim);
        font-size: 10.5px;
        flex: 0 0 auto;
      }
      .sym .name {
        color: var(--foreground);
      }
      .sym .detail {
        color: var(--hold);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .sym .n,
      .sym .uses {
        margin-left: auto;
        color: var(--dim);
        font-size: 10.5px;
        white-space: nowrap;
        font-family: var(--sans);
        flex: 0 0 auto;
      }
      .sym .n + .uses {
        margin-left: 0;
      }
      .sym .uses.zero {
        color: var(--faint);
      }
      .sym .within {
        margin-left: 18px;
        border-left: 1px solid var(--border);
        padding-left: 6px;
      }
      .usedby {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        font-size: 11px;
        color: var(--dim);
        align-items: baseline;
      }
      .usedby b {
        font-weight: 500;
      }
      .usedby a {
        color: var(--link);
        text-decoration: none;
        font-family: var(--mono);
      }
      .usedby a:hover {
        text-decoration: underline;
      }
      .usedby .n {
        color: var(--faint);
        margin-left: 2px;
      }
      .hold .n {
        font-size: 11.5px;
        color: var(--dim);
      }
      .hold .badge {
        font-size: 11px;
        color: var(--changed);
        font-family: var(--mono);
      }
      .hold .missing {
        font-size: 11px;
        color: var(--stale);
      }
      .foot {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        font-size: 11.5px;
        color: var(--faint);
        margin-top: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
