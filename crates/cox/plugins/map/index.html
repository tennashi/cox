<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Map</title>
    <!-- The page's own colors first, then the window's, which Cox serves
         beside the page, on the stage as on the phone. Nothing is inline:
         the phone serves the page under `default-src 'self'`. -->
    <link rel="stylesheet" href="./map.css" />
    <link rel="stylesheet" href="./theme.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="top" id="top">
      <span class="crumb" id="crumb"></span>
      <span class="grow"></span>
      <button id="dfb" class="drift-button" hidden></button>
    </header>
    <div id="note" class="note" hidden></div>
    <div id="cv">
      <svg id="s">
        <defs>
          <marker id="h" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--dim)" /></marker>
          <marker id="hl" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--accent)" /></marker>
        </defs>
        <g id="w"></g>
      </svg>
    </div>
    <div id="empty" class="empty" hidden></div>
    <aside id="fl" class="pane"></aside>
    <aside id="dt" class="pane"></aside>
    <aside id="dr" class="pane"></aside>
    <!-- After the panes, whose rules move it aside as they open. -->
    <div class="zoom" id="zoom">
      <button data-z="-1" title="Zoom out">−</button><button data-z="0" title="Fit">⤢</button><button data-z="1" title="Zoom in">+</button>
    </div>
  </body>
</html>
