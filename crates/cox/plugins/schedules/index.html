<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Schedules</title>
    <style>
      /* The colors of the window (see `ui::theme`), as the Map and Wiki
         plugins have them: the page sits on the stage's card, as Cox's
         own tabs do. */
      :root {
        color-scheme: dark;
        --foreground: #e4e4e6;
        --background: #151517;
        --card: #17171a;
        --card-hover: #1f1f23;
        --dim: #a5a5ab;
        --faint: #8e8e95;
        --link: #a6ebe1;
        --border: #2c2c31;
        --hover: #222226;
        --accent: #6fd3c5;
        --code: #e7b98a;
        --code-ground: #1d1d21;
        --warn: #e8b660;
        --broken: #ec8580;
        --sans: -apple-system, "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        --mono: Menlo, "DejaVu Sans Mono", monospace;
      }
      html,
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font: 13px/1.5 var(--sans);
      }
      #app {
        max-width: 760px;
        margin: 0 auto;
        padding: 12px 20px 40px;
        box-sizing: border-box;
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      code {
        font: 12px var(--mono);
        color: var(--code);
        background: var(--code-ground);
        border-radius: 4px;
        padding: 1px 4px;
      }
      .head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
        margin-bottom: 12px;
      }
      .head h1 {
        font-size: 15px;
        margin: 0;
      }
      .head .where {
        margin-left: auto;
        font-size: 11.5px;
        color: var(--faint);
        font-family: var(--mono);
        overflow-wrap: anywhere;
      }
      .group {
        font: 600 10.5px var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 16px 0 6px;
      }
      .group .path {
        color: var(--faint);
        font: 11.5px var(--mono);
        letter-spacing: 0;
        text-transform: none;
        margin-left: 6px;
      }
      .schedule {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      .schedule .top {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px;
      }
      .schedule .name {
        font-weight: 600;
      }
      .schedule .every {
        font: 11.5px var(--mono);
        color: var(--dim);
      }
      .schedule .file {
        margin-left: auto;
        font: 11.5px var(--mono);
      }
      .times {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        margin-top: 4px;
        font-size: 12px;
        color: var(--dim);
      }
      .times b {
        font-weight: 400;
        color: var(--faint);
        margin-right: 4px;
      }
      .due {
        color: var(--accent);
      }
      .line {
        margin: 8px 0 0;
        padding: 6px 10px;
        border-left: 3px solid var(--border);
        color: var(--foreground);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 7.5em;
        overflow: hidden;
      }
      .allow {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 8px;
        align-items: center;
        font-size: 11.5px;
        color: var(--faint);
      }
      .chip {
        font: 11px var(--mono);
        color: var(--dim);
        background: var(--hover);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0 8px;
      }
      .unread {
        border: 1px solid var(--warn);
        border-radius: 10px;
        padding: 8px 12px;
        margin-bottom: 8px;
        color: var(--warn);
        overflow-wrap: anywhere;
      }
      .empty {
        color: var(--dim);
        padding: 12px 2px;
      }
      .empty pre {
        background: var(--code-ground);
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--foreground);
        font: 12px var(--mono);
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="app.js"></script>
  </body>
</html>
