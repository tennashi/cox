<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Parts (web)</title>
    <script type="importmap">
      {
        "imports": {
          "preact": "cox://vendor/preact.mjs",
          "preact/hooks": "cox://vendor/hooks.mjs",
          "htm": "cox://vendor/htm.mjs"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --foreground: #d4d4d4;
        --background: #1e1e1e;
        --card: #252628;
        --card-hover: #2c2e31;
        --chip: #1a1b1d;
        --dim: #9a9a9a;
        --faint: #6e6e6e;
        --link: #7fb4ff;
        --border: #3a3b3e;
        --line: #7a7a7a;
        --running: #8fd19e;
        --process: #e5a85a;
        --thread: #6cb8ff;
        --window: #8fd19e;
        --sans: -apple-system, "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        --mono: Menlo, "DejaVu Sans Mono", monospace;
      }
      html,
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font: 13px/1.45 var(--sans);
      }
      #app {
        padding: 14px 16px 32px;
        max-width: 1100px;
      }
      .top {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 8px 16px;
        margin-bottom: 4px;
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }
      .status {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--dim);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .status .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--faint);
      }
      .status.running {
        color: var(--running);
        border-color: color-mix(in srgb, var(--running) 40%, transparent);
      }
      .status.running .dot {
        background: var(--running);
      }
      .lead {
        color: var(--dim);
        font-size: 12px;
        margin: 0 0 14px;
      }
      .lead .error {
        color: #f08080;
      }
      .legend {
        display: flex;
        gap: 14px;
        margin-left: auto;
        font-size: 11px;
        color: var(--dim);
      }
      .legend span::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        margin-right: 5px;
        vertical-align: 0;
        background: var(--kind);
      }
      .row {
        margin: 0 0 22px;
      }
      .row-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 8px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--border);
      }
      .row-head .name {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .row-head .when {
        font-size: 11.5px;
        color: var(--faint);
      }
      .across {
        display: flex;
        align-items: stretch;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .part {
        box-sizing: border-box;
        flex: 1 1 0;
        min-width: 168px;
        max-width: 260px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 12px 9px 13px;
        border: 1px solid var(--border);
        border-left: 3px solid var(--kind);
        border-radius: 6px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
      }
      a.part:hover {
        background: var(--card-hover);
        border-color: color-mix(in srgb, var(--kind) 60%, var(--border));
        border-left-color: var(--kind);
        cursor: pointer;
      }
      .part .head {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .part .kind {
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--kind);
      }
      .part .name {
        font-size: 14px;
        font-weight: 600;
        font-family: var(--mono);
        overflow-wrap: anywhere;
      }
      .part .says {
        font-size: 12.5px;
        line-height: 1.4;
      }
      .part .started {
        font-size: 11.5px;
        color: var(--dim);
        line-height: 1.35;
      }
      .part .detail {
        margin-top: 2px;
        font: 11px/1.4 var(--mono);
        color: var(--foreground);
        background: var(--chip);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 6px;
        overflow-wrap: anywhere;
        display: flex;
        gap: 6px;
        align-items: flex-start;
      }
      .part .detail::before {
        content: "";
        flex: none;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--running);
        margin-top: 4px;
      }
      .part .code {
        margin-top: auto;
        padding-top: 4px;
        font: 11px var(--mono);
        color: var(--faint);
      }
      a.part .code {
        color: var(--link);
      }
      a.part:hover .code {
        text-decoration: underline;
      }
      .between {
        width: 84px;
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 0 6px;
        align-self: center;
      }
      .between .label {
        font-size: 11px;
        color: var(--dim);
        text-align: center;
        line-height: 1.25;
      }
      .between svg {
        width: 100%;
        height: 12px;
        display: block;
        overflow: visible;
      }
      .between line {
        stroke: var(--line);
        stroke-width: 1.5;
      }
      .between polygon {
        fill: var(--line);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
