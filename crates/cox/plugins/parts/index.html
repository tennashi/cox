<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Parts (web)</title>
    <script type="importmap">
      {
        "imports": {
          "preact": "./vendor/preact.mjs",
          "preact/hooks": "./vendor/hooks.mjs",
          "htm": "./vendor/htm.mjs"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --foreground: #d4d4d4;
        --background: #1e1e1e;
        --dim: #a0a0a0;
        --link: #7fb4ff;
        --border: #404040;
        --hover: #2a2d2e;
        --changed: #8fd19e;
      }
      html,
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font: 13px/1.45 Menlo, "DejaVu Sans Mono", monospace;
      }
      #app {
        padding: 12px 16px 24px;
      }
      .heading {
        color: var(--dim);
        font-size: 11px;
        margin-bottom: 12px;
        white-space: pre-wrap;
      }
      .heading .error {
        color: #f08080;
      }
      .row {
        margin-bottom: 20px;
      }
      .when {
        color: var(--dim);
        font-size: 11px;
        margin-bottom: 4px;
      }
      .across {
        display: flex;
        align-items: stretch;
        gap: 0;
      }
      .part {
        box-sizing: border-box;
        width: 180px;
        flex: none;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        color: inherit;
        text-decoration: none;
      }
      .part .name {
        font-weight: bold;
      }
      .part .says,
      .part .started {
        font-size: 11px;
        color: var(--dim);
      }
      .part .detail {
        font-size: 11px;
        color: var(--foreground);
        word-break: break-all;
      }
      .part .code {
        font-size: 11px;
        color: var(--dim);
        margin-top: auto;
      }
      a.part:hover {
        background: var(--hover);
        cursor: pointer;
      }
      a.part:hover .code {
        color: var(--link);
      }
      .between {
        width: 84px;
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-size: 11px;
        color: var(--dim);
        text-align: center;
        padding: 0 4px;
      }
      .between .arrow {
        display: flex;
        align-items: center;
        width: 100%;
      }
      .between .line {
        flex: 1;
        height: 1px;
        background: var(--dim);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
