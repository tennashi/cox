<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Knowledge</title>
    <style>
      /* The colors of the window (see `ui::theme`), as the Map plugin
         has them: the page sits on the stage's card, as Cox's own tabs
         do. */
      :root {
        color-scheme: dark;
        --foreground: #e4e4e6;
        --background: #151517;
        --card: #17171a;
        --card-hover: #1f1f23;
        --dim: #a5a5ab;
        --faint: #8e8e95;
        --link: #a6ebe1;
        --border: #2c2c31;
        --hover: #222226;
        --accent: #6fd3c5;
        --code: #e7b98a;
        --code-ground: #1d1d21;
        --warn: #e8b660;
        --broken: #ec8580;
        --sans: -apple-system, "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        --mono: Menlo, "DejaVu Sans Mono", monospace;
      }
      html,
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font: 13px/1.5 var(--sans);
      }
      #app {
        padding: 12px 16px 40px;
        box-sizing: border-box;
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      /* The heading, as Cox's own tabs have it (see `stage::heading`):
         the title, a line on what the tab shows, and, at the right
         edge, where it shows it from. */
      .head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 4px;
        min-height: 26px;
        margin-bottom: 4px;
        white-space: nowrap;
      }
      .head h1 {
        flex: none;
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      .head .summary {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--dim);
      }
      .head .where {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: right;
        font: 11.5px var(--mono);
        color: var(--faint);
      }
      .head .summary a {
        color: var(--foreground);
      }
      /* The shelves: the human's wiki, the project's, and the sources,
         as the parts of one control, beside the line that narrows them. */
      .shelves {
        display: inline-flex;
        flex: none;
        gap: 2px;
        padding: 2px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .shelf {
        color: var(--dim);
        border-radius: 8px;
        padding: 3px 10px;
      }
      .shelf:hover {
        color: var(--foreground);
        text-decoration: none;
      }
      .shelf.on {
        color: var(--foreground);
        background: var(--hover);
      }
      .shelf b {
        margin-left: 6px;
        font-weight: 400;
        font-size: 11.5px;
        color: var(--faint);
      }
      .find {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin: 6px 0 12px;
      }
      .find input {
        flex: 1 1 220px;
        font: 13px var(--sans);
        color: var(--foreground);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        outline: none;
      }
      .find input:focus {
        border-color: var(--dim);
      }
      .chip {
        font: 11.5px var(--sans);
        color: var(--dim);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 9px;
        cursor: pointer;
        user-select: none;
      }
      .chip:hover {
        color: var(--foreground);
      }
      .chip.on {
        color: var(--foreground);
        border-color: var(--dim);
        background: var(--hover);
      }
      .chip b {
        font-weight: 600;
      }
      .pages {
        display: flex;
        flex-direction: column;
      }
      .pages.card {
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      .entry {
        display: block;
        color: var(--foreground);
        padding: 8px 12px;
      }
      .entry + .entry {
        border-top: 1px solid var(--border);
      }
      .entry:hover {
        background: var(--card-hover);
        text-decoration: none;
      }
      .entry .title {
        font-weight: 600;
      }
      .entry .name {
        margin-left: 6px;
        font: 11.5px var(--mono);
        color: var(--faint);
      }
      .entry .about {
        color: var(--dim);
        margin-top: 1px;
      }
      .entry .last {
        font-size: 11.5px;
        color: var(--faint);
        margin-top: 2px;
      }
      .mark {
        display: inline-block;
        margin-left: 6px;
        font: 600 9.5px var(--sans);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border-radius: 4px;
        padding: 1px 5px;
        vertical-align: 1px;
        color: var(--warn);
        border: 1px solid currentColor;
      }
      .only {
        display: inline-block;
        margin-left: 6px;
        font: 600 9.5px var(--sans);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border-radius: 4px;
        padding: 1px 5px;
        vertical-align: 1px;
        color: var(--background);
        background: var(--accent);
      }
      .mark.broken {
        color: var(--broken);
      }
      .empty {
        color: var(--dim);
        padding: 24px 10px;
      }
      .empty code,
      .page code {
        font: 12px var(--mono);
        color: var(--code);
        background: var(--code-ground);
        border-radius: 4px;
        padding: 1px 4px;
      }
      .page h1 {
        font-size: 20px;
        margin: 4px 0 10px;
      }
      .page h2 {
        font-size: 15px;
        margin: 18px 0 6px;
      }
      .page h3 {
        font-size: 13.5px;
        margin: 14px 0 4px;
      }
      .page pre {
        background: var(--code-ground);
        border-radius: 8px;
        padding: 10px 12px;
        overflow-x: auto;
      }
      .page pre code {
        background: none;
        padding: 0;
        color: var(--foreground);
      }
      .page a.missing {
        color: var(--broken);
        text-decoration: underline dotted;
      }
      .page table {
        border-collapse: collapse;
      }
      .page th,
      .page td {
        border: 1px solid var(--border);
        padding: 3px 8px;
      }
      .page blockquote {
        margin: 8px 0;
        padding-left: 12px;
        border-left: 3px solid var(--border);
        color: var(--dim);
      }
      .aside {
        margin-top: 22px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }
      .aside h2 {
        font: 600 10.5px var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 0 0 6px;
      }
      .aside ul {
        margin: 0;
        padding-left: 18px;
      }
      .aside li {
        margin: 2px 0;
      }
      .aside .day {
        font: 11.5px var(--mono);
        color: var(--faint);
        margin-right: 6px;
      }
      .aside .none {
        color: var(--dim);
      }
      .says {
        color: var(--dim);
        margin: 0 0 4px;
      }
      /* Which language a page is read in, and how far it is translated. */
      .languages {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      .languages .chip {
        flex: none;
        white-space: nowrap;
      }
      .translating {
        flex: 1 1 0;
        min-width: 0;
        font-size: 11.5px;
        color: var(--faint);
        align-self: center;
      }
      .translating.failed {
        color: var(--warn);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="app.js"></script>
  </body>
</html>
