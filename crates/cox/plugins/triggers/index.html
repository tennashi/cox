<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Triggers</title>
    <style>
      /* The colors of the window (see `ui::theme`), as the other plugins
         have them: the page sits on the stage's card, as Cox's own tabs
         do. */
      :root {
        color-scheme: dark;
        --foreground: #e4e4e6;
        --background: #151517;
        --card: #17171a;
        --raised: #1f1f23;
        --ground: #0e0e0f;
        --dim: #a5a5ab;
        --faint: #8e8e95;
        --disabled: #5f5f66;
        --link: #a6ebe1;
        --border: #2c2c31;
        --border-strong: #36363b;
        --hover: #1f1f23;
        --accent: #6fd3c5;
        --accent-ground: #2f6b64;
        --warn: #e5b46d;
        --broken: #de6b66;
        --code: #e7b98a;
        --code-ground: #1d1d21;
        --sans: -apple-system, "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        --mono: Menlo, "DejaVu Sans Mono", monospace;
      }
      html,
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font: 13px/1.5 var(--sans);
      }
      #app {
        padding: 12px 16px 40px;
        box-sizing: border-box;
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      code {
        font: 12px var(--mono);
        color: var(--code);
        background: var(--code-ground);
        border-radius: 4px;
        padding: 1px 4px;
      }
      .folder {
        margin: 22px 0 4px;
        padding: 0 4px;
        font-size: 13px;
        font-weight: 600;
      }
      .folder span {
        margin-left: 8px;
        font: 11.5px var(--mono);
        font-weight: 400;
        color: var(--faint);
      }
      h2 {
        margin: 16px 0 6px;
        padding: 0 4px;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .rows {
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 12px;
        border-top: 1px solid var(--border);
        cursor: pointer;
      }
      .row:first-child {
        border-top: none;
      }
      .row:hover {
        background: var(--hover);
      }
      .row.off > :not(.switch) {
        opacity: 0.5;
      }
      .row.dragging {
        opacity: 0.4;
      }
      .row.over {
        box-shadow: inset 0 2px 0 var(--accent);
      }
      .handle {
        width: 10px;
        margin-right: -6px;
        color: transparent;
        font-size: 14px;
        cursor: grab;
        user-select: none;
        touch-action: none;
      }
      .row:hover .handle {
        color: var(--faint);
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex-shrink: 0;
        box-sizing: border-box;
        border: 1.5px solid var(--disabled);
      }
      .dot.passed {
        background: var(--accent);
        border-color: var(--accent);
      }
      .dot.failed {
        background: var(--warn);
        border-color: var(--warn);
      }
      .dot.broken {
        background: var(--broken);
        border-color: var(--broken);
      }
      .name {
        width: 120px;
        flex-shrink: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .does {
        flex: 1;
        min-width: 0;
        font: 12.5px var(--mono);
        color: var(--dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .last {
        width: 80px;
        flex-shrink: 0;
        font-size: 12px;
        color: var(--dim);
      }
      .next {
        width: 72px;
        flex-shrink: 0;
        font-size: 12px;
        color: var(--dim);
      }
      .scope {
        width: 64px;
        flex-shrink: 0;
        text-align: right;
        font-size: 12px;
        color: var(--dim);
      }
      .switch {
        position: relative;
        width: 28px;
        height: 16px;
        border-radius: 8px;
        flex-shrink: 0;
        background: var(--border);
        cursor: pointer;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--faint);
        transition: left 0.12s;
      }
      .switch.on {
        background: var(--accent-ground);
      }
      .switch.on::after {
        left: 14px;
        background: var(--foreground);
      }
      .more {
        width: 10px;
        color: var(--disabled);
      }
      .unread {
        border: 1px solid var(--warn);
        border-radius: 10px;
        padding: 8px 12px;
        margin-bottom: 8px;
        color: var(--warn);
        overflow-wrap: anywhere;
      }
      .empty {
        color: var(--dim);
        padding: 4px;
      }
      .empty pre {
        background: var(--code-ground);
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--foreground);
        font: 12px var(--mono);
        overflow-x: auto;
      }
      /* The card of a trigger, over the list. */
      #sheet {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 48px 16px;
        box-sizing: border-box;
        overflow-y: auto;
      }
      #sheet[hidden] {
        display: none;
      }
      .card {
        width: 580px;
        max-width: 100%;
        background: var(--background);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-wrap: wrap;
        overflow: hidden;
      }
      .card.talking {
        width: 1060px;
        height: min(640px, calc(100vh - 96px));
      }
      .card .side {
        flex: 1 1 480px;
        min-width: 0;
        max-height: 100%;
        display: flex;
        flex-direction: column;
      }
      .card .main {
        flex: 1;
        overflow-y: auto;
        padding: 12px 20px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .card .top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 20px 6px;
      }
      .card .top .title {
        width: 180px;
        padding: 2px 4px;
        margin-left: -4px;
        background: transparent;
        border: none;
        border-radius: 6px;
        color: var(--foreground);
        font: 600 16px var(--sans);
        outline: none;
      }
      .card .top .title:focus {
        background: var(--ground);
      }
      .card .top .where {
        cursor: pointer;
      }
      .caret {
        margin-left: 5px;
        font-size: 9px;
        color: var(--disabled);
      }
      .card .top .where {
        padding: 2px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        font-size: 12px;
        color: var(--dim);
      }
      .card .top .status {
        font-size: 12px;
        color: var(--dim);
      }
      .card .top .close {
        margin-left: auto;
        color: var(--faint);
        font-size: 18px;
        cursor: pointer;
        line-height: 1;
      }
      .settings {
        display: grid;
        grid-template-columns: auto 1fr auto 1fr;
        column-gap: 12px;
        row-gap: 6px;
        align-items: baseline;
        padding: 10px 12px;
        border-radius: 10px;
        background: #1a1a1d;
        border: 1px solid #26262b;
        font-size: 12.5px;
      }
      .settings .label {
        color: var(--disabled);
        white-space: nowrap;
      }
      .settings .value {
        color: #c9c9ce;
        overflow-wrap: anywhere;
      }
      .settings .wide {
        grid-column: 2 / 5;
      }
      .section {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--faint);
      }
      .section::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #26262b;
      }
      .text {
        padding: 12px 14px;
        background: var(--ground);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 13.5px;
        line-height: 1.7;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .text.command {
        font: 12.5px/1.6 var(--mono);
      }
      .said {
        margin: 0;
        max-height: 14em;
        overflow: auto;
        padding: 10px 12px;
        background: var(--ground);
        border-radius: 10px;
        font: 12px/1.5 var(--mono);
        color: var(--dim);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .card .foot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        font-size: 12.5px;
      }
      .grow {
        flex: 1;
      }
      .faint {
        color: var(--faint);
      }
      .unsaved {
        color: var(--warn);
        white-space: nowrap;
      }
      .error {
        color: var(--broken);
        overflow-wrap: anywhere;
      }
      /* The button of the window (see `ui::button`): 28 high, rounded
         by 8, filled; the one the human most likely wants in the
         accent, and one that takes something away quiet. */
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        height: 28px;
        padding: 0 10px;
        border-radius: 8px;
        background: #26262b;
        color: var(--foreground);
        font-size: 13px;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
      }
      .button:hover {
        background: #303036;
      }
      .button.quiet {
        background: transparent;
        color: var(--dim);
      }
      .button.quiet:hover {
        background: #26262b;
        color: var(--foreground);
      }
      .button.primary {
        background: var(--accent);
        color: var(--ground);
        font-weight: 600;
      }
      .button.primary:hover {
        opacity: 0.9;
      }
      /* The heading, as Cox's own tabs have it (see `stage::heading`):
         the title, a line on what the tab shows, and, at the right
         edge, where it shows it from. */
      .head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 4px;
        min-height: 26px;
        margin-bottom: 4px;
        white-space: nowrap;
      }
      .head h1 {
        flex: none;
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      .head .summary {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--dim);
      }
      .head .where {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: right;
        font: 11.5px var(--mono);
        color: var(--faint);
      }
      .head .button {
        flex: none;
      }
      /* What the human changed and did not save. */
      .value.changed,
      .first.changed,
      .top .changed,
      .line.changed .field input,
      .line.changed .chip.chosen,
      textarea.text.changed {
        background: #2c2516;
        box-shadow: 0 2px 0 var(--warn);
      }
      .line {
        display: grid;
        grid-template-columns: 76px 1fr;
        gap: 12px;
        align-items: center;
        padding: 2px 0;
      }
      .line .label {
        font-size: 12.5px;
        color: var(--dim);
      }
      .line.changed .label {
        color: var(--warn);
      }
      .chips,
      .patterns {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .chip {
        padding: 4px 11px;
        border-radius: 8px;
        border: 1px solid var(--border);
        color: var(--dim);
        font-size: 12.5px;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
      }
      .chip.chosen {
        background: #152c2a;
        border-color: var(--accent);
        color: var(--foreground);
      }
      .field input {
        width: 100%;
        box-sizing: border-box;
        padding: 5px 10px;
        border-radius: 8px;
        background: var(--ground);
        border: 1px solid var(--border-strong);
        color: var(--foreground);
        font: 12.5px var(--mono);
        outline: none;
      }
      .field input:focus,
      textarea:focus {
        border-color: var(--accent);
      }
      .pattern {
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--raised);
        border: 1px solid var(--border);
        font: 12px var(--mono);
        white-space: nowrap;
      }
      .drop {
        margin-left: 6px;
        color: var(--disabled);
        cursor: pointer;
      }
      .drop:hover {
        color: var(--foreground);
      }
      .field input.add {
        width: 120px;
        padding: 3px 9px;
        border-radius: 999px;
        border-style: dashed;
        font-size: 12px;
      }
      textarea.text {
        width: 100%;
        box-sizing: border-box;
        min-height: 200px;
        resize: vertical;
        color: var(--foreground);
        font: 13.5px/1.7 var(--sans);
        outline: none;
      }
      textarea.text.command {
        font: 12.5px/1.6 var(--mono);
      }
      .folded {
        position: relative;
        cursor: pointer;
      }
      .folded .unfold {
        position: absolute;
        right: 12px;
        top: 10px;
        font-size: 11px;
        color: var(--disabled);
      }
      .folded.settings {
        padding-right: 30px;
      }
      .folded.do {
        padding: 10px 30px 10px 12px;
        border-radius: 10px;
        background: #1a1a1d;
        border: 1px solid #26262b;
        font-size: 12.5px;
        color: var(--dim);
      }
      .folded.do .first {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tried {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
      }
      .dot.running {
        border-color: var(--accent);
      }
      /* The talk beside the card. */
      .talk {
        flex: 1 1 300px;
        min-width: 0;
        max-height: 100%;
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--border);
      }
      .talk-top {
        display: flex;
        align-items: center;
        padding: 16px 18px 10px;
        font-size: 13px;
        color: var(--dim);
      }
      .close {
        color: var(--faint);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }
      .said-all {
        flex: 1;
        overflow-y: auto;
        padding: 8px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        font-size: 13.5px;
        line-height: 1.6;
      }
      .entry {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-start;
      }
      .entry .who {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--dim);
      }
      .entry .words {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .laid {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border-radius: 999px;
        background: #26262b;
        font-size: 12px;
        color: #c9c9ce;
      }
      textarea.reply {
        margin: 14px 18px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid var(--border-strong);
        background: transparent;
        color: var(--foreground);
        font: 13px/1.5 var(--sans);
        resize: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="sheet" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
