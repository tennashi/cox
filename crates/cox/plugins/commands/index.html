<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Commands</title>
    <link rel="stylesheet" href="cox://api/theme.css" />
    <style>
      /* The colors of the window, which Cox gives every plugin as
         `cox://api/theme.css` (see `ui::theme`). */
      :root {
        --sans: -apple-system, "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        --mono: Menlo, "DejaVu Sans Mono", monospace;
      }
      html,
      body {
        margin: 0;
        background: var(--surface);
        color: var(--foreground);
        font: 13px/1.5 var(--sans);
      }
      #app {
        padding: 12px 16px 40px;
        box-sizing: border-box;
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 4px;
        min-height: 26px;
        margin-bottom: 4px;
        white-space: nowrap;
      }
      .head h1 {
        flex: none;
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      .head .summary {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--dim);
      }
      .head .where {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: right;
        font: 11.5px var(--mono);
        color: var(--faint);
      }
      .chat {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 18px 0 6px;
        padding: 0 4px;
        font-weight: 600;
      }
      .chat a {
        color: var(--foreground);
      }
      .chat a:hover {
        color: var(--link);
      }
      .dot {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--disabled);
      }
      .dot.working {
        background: var(--link);
      }
      .step {
        margin: 0 0 8px;
      }
      .said {
        display: flex;
        gap: 6px;
        padding: 3px 4px;
        color: var(--dim);
        font-size: 12.5px;
        cursor: pointer;
        user-select: none;
      }
      .said:hover {
        color: var(--foreground);
      }
      .said .fold-mark {
        flex: none;
        width: 10px;
        color: var(--faint);
      }
      .said .text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .said .count {
        flex: none;
        color: var(--faint);
      }
      .small {
        display: flex;
        gap: 8px;
        align-items: baseline;
        margin-left: 16px;
        padding: 1px 6px;
        border-radius: 4px;
        font: 12px/1.6 var(--mono);
        color: var(--dim);
        cursor: pointer;
      }
      .small:hover,
      .small.open {
        background: var(--accent-tint);
      }
      .small .line {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* What the agent said a command is for leads; the command follows,
         fainter, as its gist. */
      .small .about {
        margin-right: 10px;
        font: 12.5px var(--sans);
        color: var(--foreground);
      }
      .small .about + .gist {
        opacity: 0.75;
      }
      .more {
        flex: none;
        color: var(--faint);
      }
      .under {
        margin: 2px 0 6px 16px;
        border: 1px solid var(--card-edge);
        border-radius: 6px;
        overflow: hidden;
      }
      .mark {
        flex: none;
      }
      .running {
        color: var(--link);
      }
      .done {
        color: var(--accent);
      }
      .failed {
        color: var(--failed);
      }
      .cancelled {
        color: var(--faint);
      }
      .secs {
        flex: none;
        color: var(--faint);
      }
      .big {
        margin: 6px 0 8px 16px;
        border: 1px solid var(--card-edge);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: var(--control-shadow);
      }
      .big.running {
        border-color: var(--accent-tint-edge);
      }
      .big .top {
        display: flex;
        gap: 12px;
        justify-content: space-between;
        padding: 6px 10px;
        background: var(--raised);
        font: 12px var(--mono);
        color: var(--foreground);
      }
      .big .top .about {
        min-width: 0;
        font: 12.5px var(--sans);
        overflow-wrap: anywhere;
      }
      .big .top .state {
        flex: none;
      }
      .big pre {
        margin: 0;
        padding: 8px 10px;
        font: 11.5px/1.5 var(--mono);
        color: var(--dim);
        background: var(--inset-ground);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .big .why {
        padding: 8px 10px;
        color: var(--dim);
        background: var(--ground);
        font-size: 12px;
      }
      /* A command laid out: a row for each command of a chain, after what
         joins it to the one before, in a gutter at the left edge, and its
         code indented as deep as the block it is in, so that a row a
         `|` or `&&` continues lines up with the row it continues. */
      .laid {
        position: relative;
        padding: 6px 10px;
        background: var(--ground);
        font: 12px/1.55 var(--mono);
        color: var(--foreground);
      }
      .laid + pre,
      .laid + .why {
        border-top: 1px solid var(--border);
      }
      .row {
        display: flex;
      }
      .joint {
        flex: none;
        width: calc(3ch + var(--depth) * 2ch);
        color: var(--faint);
      }
      .code {
        min-width: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .fold {
        display: inline-block;
        margin: 0 0.5ch;
        padding: 0 6px;
        border-radius: 4px;
        background: var(--button);
        color: var(--dim);
        font: 11px/1.6 var(--sans);
        cursor: pointer;
        user-select: none;
        box-shadow: 0 0 0 1px var(--control-edge);
      }
      .fold:hover {
        color: var(--foreground);
      }
      .body {
        margin: 2px 0 4px calc(var(--depth, 0) * 2ch + 3ch);
        padding: 2px 0 2px 10px;
        border-left: 2px solid var(--border);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--dim);
      }
      .copy {
        position: absolute;
        top: 4px;
        right: 6px;
        padding: 1px 8px;
        border: 1px solid var(--control-edge);
        border-radius: 4px;
        background: var(--button);
        color: var(--dim);
        font: 11px var(--sans);
        cursor: pointer;
        opacity: 0;
        box-shadow: var(--control-shadow);
      }
      .laid:hover .copy {
        opacity: 1;
      }
      .copy:hover {
        color: var(--foreground);
      }
      /* The code's colors, as the code tabs draw them (and the Map). */
      .hl-keyword,
      .hl-variable-builtin,
      .hl-tag,
      .hl-punctuation-special {
        color: #569cd6;
      }
      .hl-function {
        color: #dcdcaa;
      }
      .hl-type,
      .hl-type-builtin,
      .hl-constructor {
        color: #4ec9b0;
      }
      .hl-string,
      .hl-literal {
        color: #ce9178;
      }
      .hl-string-special,
      .hl-escape {
        color: #d7ba7d;
      }
      .hl-number,
      .hl-constant-builtin {
        color: #b5cea8;
      }
      .hl-comment {
        color: #6a9955;
      }
      .hl-constant,
      .hl-uri {
        color: #4fc1ff;
      }
      .hl-property,
      .hl-variable {
        color: #9cdcfe;
      }
      .hl-attribute,
      .hl-label {
        color: #c586c0;
      }
      /* What sets up the environment, as `CARGO_TARGET_DIR=…`, which the
         eye can pass over. */
      .hl-quiet {
        color: var(--faint);
      }
      .none {
        color: var(--dim);
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="app.js"></script>
  </body>
</html>
