[package]
name = "cox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# `cox` itself, and the small executable that runs CEF's helper processes
# (renderer, GPU, ...) on macOS: see `src/bin/helper.rs`.
[[bin]]
name = "cox"
path = "src/main.rs"

[[bin]]
name = "cox-helper"
path = "src/bin/helper.rs"

[dependencies]
anyhow.workspace = true
cox-acp.workspace = true
cox-android.workspace = true
cox-mac.workspace = true
cox-browser.workspace = true
cox-core.workspace = true
cox-editor.workspace = true
cox-git.workspace = true
# What runs the chats apart from the window, which it shows.
coxd.workspace = true
# runtime_shaders: compile the Metal shaders when the app starts, so a Mac
# with only the Command Line Tools (no Xcode, no `metal` compiler) can build.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# The version gpui uses, to hand it the browser's frames.
image = "0.25.10"
# Drawing a Mermaid diagram's SVG into a picture, as gpui draws SVGs:
# see `src/ui/diagram.rs`.
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts"] }
# The time the stage's plugins are told it is: see
# `src/stage/plugins.rs`.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# Reading the agent's replies as Markdown: see `src/ui/markdown.rs`.
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
unicode-segmentation = "1.12.0"
url = "2.5.8"
# The code a phone pairs with, which the settings show: see
# `src/settings/view/phone.rs`.
qrcodegen = "1.8.0"

# CEF is cox-browser's; the executables depend on its sys crate as well
# only for `build.rs`, which has to know where the CEF distribution is to
# point the dynamic loader at it on Linux. Cargo tells that to the build
# scripts of direct dependents alone.
cef-dll-sys = "=152.3.0"
# What the window reads and writes as JSON, as the stage's plugins'
# messages: see `src/stage/plugins.rs`.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The socket that answers for Cox as a whole: see `src/inspect.rs`. The
# screenshot it answers with goes as base64.
base64 = "0.22.1"
# The stage's terminals, which the human types into and the agent runs
# commands in: see `src/stage/terminal.rs`.
alacritty_terminal = "0.26.0"

# The system's notifications, and the Dock's badge: see `src/notices/macos.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSEvent", "NSResponder", "NSTextInputContext", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSUserNotification"] }
# Where a display is, for a picture of the window: see `src/ui/screen.rs`.
objc2-core-graphics = "0.3.2"

[dev-dependencies]
# Git run under the tests as under cox-git's own: see its `src/git.rs`.
cox-git = { workspace = true, features = ["test-support"] }
# What the tests share with coxd's: see its `src/testing.rs`.
coxd = { workspace = true, features = ["test-support"] }
agent-client-protocol.workspace = true
gpui = { version = "0.2.2", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
