[package]
name = "cox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# `cox` itself, and the small executable that runs CEF's helper processes
# (renderer, GPU, ...) on macOS: see `src/bin/helper.rs`.
[[bin]]
name = "cox"
path = "src/main.rs"

[[bin]]
name = "cox-helper"
path = "src/bin/helper.rs"

[dependencies]
anyhow.workspace = true
cox-acp.workspace = true
env_logger = "0.11.11"
# runtime_shaders: compile the Metal shaders when the app starts, so a Mac
# with only the Command Line Tools (no Xcode, no `metal` compiler) can build.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# The version gpui uses, to hand it the browser's frames.
image = "0.25.10"
log = "0.4.29"
# Reading the agent's replies as Markdown: see `src/markdown.rs`.
pulldown-cmark = { version = "0.13.5", default-features = false }
# Working out the change an edit makes, to show it: see `src/diff.rs`.
similar = "3.2.0"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1.12.0"

# The stage runs on Linux and macOS. On macOS, CEF lives in an app bundle
# that `cargo xtask bundle` assembles; see CONTRIBUTING.md.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
cef = { version = "=152.3.0", default-features = false }
# cef accepts any 152.x of its sys crate, and the newest expects a newer
# CEF than the one these bindings were generated from; pin the pair that
# matches CEF 152.0.6.
cef-dll-sys = "=152.3.0"
# The relay between the agent's browser tools and the stage: see
# `src/relay.rs`.
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# Reading only the head of what the browser sends the agent: see
# `src/relay.rs`.
serde = { version = "1.0.229", features = ["derive"] }
# Signal handlers in place of CEF's (`src/quit.rs`), and keeping Cox's open
# files from the agent (`src/agent.rs`).
libc = "0.2.188"
serde_json = "1.0.154"
tokio-tungstenite = "0.30.0"

# CEF expects a little of the app's Objective-C class on macOS: see
# `src/macos.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[dev-dependencies]
agent-client-protocol.workspace = true
gpui = { version = "0.2.2", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
