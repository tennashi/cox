[package]
name = "cox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# `cox` itself, and the small executable that runs CEF's helper processes
# (renderer, GPU, ...) on macOS: see `src/bin/helper.rs`.
[[bin]]
name = "cox"
path = "src/main.rs"

[[bin]]
name = "cox-helper"
path = "src/bin/helper.rs"

[dependencies]
anyhow.workspace = true
cox-acp.workspace = true
cox-browser.workspace = true
cox-core.workspace = true
cox-editor.workspace = true
env_logger = "0.11.11"
# runtime_shaders: compile the Metal shaders when the app starts, so a Mac
# with only the Command Line Tools (no Xcode, no `metal` compiler) can build.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# The version gpui uses, to hand it the browser's frames.
image = "0.25.10"
log = "0.4.29"
# Reading the agent's replies as Markdown: see `src/ui/markdown.rs`.
pulldown-cmark = { version = "0.13.5", default-features = false }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1.12.0"

# CEF is cox-browser's; the executables depend on its sys crate as well
# only for `build.rs`, which has to know where the CEF distribution is to
# point the dynamic loader at it on Linux. Cargo tells that to the build
# scripts of direct dependents alone.
cef-dll-sys = "=152.3.0"
# Keeping Cox's open files from the agent (`src/agent.rs`), and the
# terminals' pseudoterminals (`src/stage/terminal/pty.rs`).
libc = "0.2.188"
# Cox's own MCP server: see `src/agent/mcp.rs`.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The stage's terminals, which the human types into and the agent runs
# commands in: see `src/stage/terminal.rs`.
alacritty_terminal = "0.26.0"

[dev-dependencies]
agent-client-protocol.workspace = true
gpui = { version = "0.2.2", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
