<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Cox's app icon: the wake of a boat curving into a C, and the boat,
       in the amber of a chat that waits for the human, steering at its tip.
       Drawn on the 1024 grid of a macOS icon: the rounded square is 824
       wide, with room around it for its shadow. `cargo xtask bundle`
       renders it into the app's Cox.icns. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262b"/>
      <stop offset="1" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6ebe1"/>
      <stop offset="0.5" stop-color="#6fd3c5"/>
      <stop offset="1" stop-color="#4f9e93"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="square">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <!-- The C: a circle less one set off to the right, opened on the right. -->
    <mask id="c">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="512" cy="512" r="290" fill="#fff"/>
      <circle cx="575" cy="512" r="225" fill="#000"/>
      <polygon points="512,512 1250.8,-433.6 1600,512 1403.8,1315" fill="#000"/>
    </mask>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ground)" filter="url(#shadow)"/>
  <g clip-path="url(#square)">
    <g transform="rotate(-5 512 512)">
      <rect width="1024" height="1024" fill="url(#teal)" mask="url(#c)"/>
      <path transform="translate(722.4 339.2) rotate(46)"
            d="M -60 0 C -30 -26, 60 -26, 120 0 C 60 26, -30 26, -60 0 Z" fill="#e5b46d"/>
    </g>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
