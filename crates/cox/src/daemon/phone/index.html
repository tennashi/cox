<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#151517">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cox</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header id="head">
  <div class="card">
    <div class="bar">
      <a id="back" class="icon-button" href="#" aria-label="Back to the chats" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <a id="switcher" href="#">
        <img id="app-icon" src="/icon.svg" alt="">
        <span id="dot" class="dot" hidden></span>
        <span id="title">Cox</span>
        <span id="waiting" class="badge" hidden></span>
      </a>
      <button id="goal-button" class="icon-button" type="button" aria-label="Set the chat's goal" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"></path></svg>
      </button>
      <button id="sketch-button" class="icon-button" type="button" aria-label="Start a sketch" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v12"></path><path d="M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path><path d="M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
      </button>
      <button id="changes-button" class="icon-button" type="button" aria-label="What changed" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v8M8 8h8M8 19h8"></path></svg>
        <span id="changes-count" class="count"></span>
      </button>
      <button id="push-button" class="icon-button" type="button" aria-label="Tell me of the chats that need me" aria-pressed="false" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      </button>
    </div>
    <details id="plan" hidden></details>
    <p id="lost" hidden>Cox cannot be reached. Trying again…</p>
    <p id="note" hidden></p>
  </div>
</header>
<main id="main"></main>
<footer id="bottom">
  <div class="card">
    <p id="failed" hidden></p>
    <p id="held" hidden></p>
    <form id="goal-form" hidden>
      <label for="goal-line">GOAL · WORDS, OR $ AND A COMMAND · EMPTY CLEARS IT</label>
      <input id="goal-line" autocomplete="off" enterkeyhint="done" placeholder="$ cargo xtask ci">
    </form>
    <form id="sketch-form" hidden>
      <label id="sketch-label" for="sketch-line">SKETCH · WHAT IT TRIES · ENTER STARTS IT</label>
      <div class="sketch-row">
        <input id="sketch-line" autocomplete="off" enterkeyhint="go" placeholder="What to find out">
        <button id="sketch-from" class="chip" type="button">from the project</button>
      </div>
      <div id="sketch-endings" class="answers" hidden></div>
    </form>
    <form id="compose" hidden>
      <textarea id="line" rows="1" aria-label="A line to the agent"></textarea>
      <div class="compose-row">
        <button id="stop" type="button" aria-label="Stop the turn" hidden>
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect width="10" height="10" rx="2" fill="currentColor"></rect></svg>
        </button>
        <button id="send" type="submit" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M6 11l6-6 6 6"></path></svg>
        </button>
      </div>
    </form>
  </div>
</footer>
</body>
</html>
