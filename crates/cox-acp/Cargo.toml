[package]
name = "cox-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
agent-client-protocol = { workspace = true, features = ["process"] }
anyhow.workspace = true
# A picture in a prompt goes as base64.
base64 = "0.22.1"
# The commands an agent runs, which a daemon tells its window of.
serde = { version = "1.0.229", features = ["derive"] }
# A line steered into a turn goes in a request ACP's schema does not have.
serde_json = "1.0.154"
tokio = { workspace = true, features = ["macros", "sync"] }
# The files a prompt points to, by their `file:` URIs.
url = "2.5.8"
# What Cox and the agent say to each other, for the logs: see `launch`.
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
