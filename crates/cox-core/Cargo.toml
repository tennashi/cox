[package]
name = "cox-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
# SQLite built from its source, so that every Cox keeps chats the same way
# whatever the system has.
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Working out the change an edit makes, to show it: see `src/diff.rs`.
similar = "3.2.0"
