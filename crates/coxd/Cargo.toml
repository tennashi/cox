[package]
name = "coxd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# What the tests of coxd and of the window share: see `src/testing.rs`.
test-support = ["cox-git/test-support"]

[dependencies]
anyhow.workspace = true
cox-acp.workspace = true
cox-core.workspace = true
cox-editor.workspace = true
cox-git.workspace = true
cox-mac.workspace = true
# The version gpui uses, to read the pictures the conversations show:
# see `src/media.rs`.
image = "0.25.10"
# When a file went to the trash: see `src/trash.rs`.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# Keeping Cox's open files from the programs it starts: see
# `src/process.rs`.
libc.workspace = true
# Reading the agent's replies as Markdown, and the wiki's pages as HTML,
# for the stage's Wiki plugin: see `src/wiki/told.rs`.
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
# Drawing an SVG the human chooses as a project's icon into a picture:
# see `src/project_icon.rs`.
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts"] }
# Reading a web page whole for raw_keep, its article as Markdown, apart
# from the site's menus, as Readability does: see `src/raw/page.rs`.
dom_smoothie = "0.19.0"
dom_query = "0.29.0"
encoding_rs = "0.8.42"
# Cox's own MCP server hands the agent pictures as base64: see
# `src/agent/mcp.rs`.
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
# What Cox says of itself, and what others say through `log`, on standard
# error, and as JSON in a file of each run's own: see `src/logs.rs`.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "std", "tracing-log"] }
# Fetching the ACP Registry's agents: see `src/agents.rs`.
ureq = "3.4.2"
url = "2.5.8"
# Downloading the programs of the ACP Registry's agents, checking each
# archive's SHA-256 and unpacking it: see `src/agents/download.rs`.
sha2 = "0.10.9"
flate2 = "1.1.10"
tar = "0.4.46"
bzip2 = "0.6.1"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
agent-client-protocol.workspace = true
cox-git = { workspace = true, features = ["test-support"] }
