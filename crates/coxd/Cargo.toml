[package]
name = "coxd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# What the tests of coxd and of the window share: see `src/testing.rs`.
test-support = ["dep:cox-git", "cox-git/test-support"]

[dependencies]
cox-core.workspace = true
# Git run as under tests, for `testing`'s repositories.
cox-git = { workspace = true, optional = true }
# When a file went to the trash: see `src/trash.rs`.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# Keeping Cox's open files from the programs it starts: see
# `src/process.rs`.
libc.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing.workspace = true
url = "2.5.8"

[dev-dependencies]
cox-git = { workspace = true, features = ["test-support"] }
