[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Plain `cargo build` and `cargo test` cover Cox itself; checks that must
# include xtask pass `--workspace`.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tennashi/cox"

# Dependencies carry no debug info: with gpui's and CEF's, every test
# binary came out above half a gigabyte, more than CI's disk holds for all
# of them together.
[profile.dev.package."*"]
debug = false

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace.dependencies]
agent-client-protocol = "3.4.0"
anyhow = "1.0.104"
cox-acp = { path = "crates/cox-acp", version = "0.1.0" }
cox-android = { path = "crates/cox-android", version = "0.1.0" }
cox-browser = { path = "crates/cox-browser", version = "0.1.0" }
cox-core = { path = "crates/cox-core", version = "0.1.0" }
cox-editor = { path = "crates/cox-editor", version = "0.1.0" }
cox-git = { path = "crates/cox-git", version = "0.1.0" }
cox-mac = { path = "crates/cox-mac", version = "0.1.0" }
coxd = { path = "crates/coxd", version = "0.1.0" }
# Exactly this release: gpui's xattr 0.2 does not build with later ones on
# Linux. Update it once gpui moves off that xattr.
libc = "=0.2.188"
tokio = "1.54.1"
tracing = "0.1.44"
xshell = "0.2.7"
