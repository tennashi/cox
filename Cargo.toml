[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Plain `cargo build` and `cargo test` cover Cox itself; checks that must
# include xtask pass `--workspace`.
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tennashi/cox"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace.dependencies]
agent-client-protocol = "3.4.0"
anyhow = "1.0.104"
cox-acp = { path = "crates/cox-acp", version = "0.0.0" }
tokio = "1.54.0"
xshell = "0.2.7"
