name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    strategy:
      # A failure on one system says nothing of the other, so let both finish.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the system libraries that gpui links on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Install the tools that build CEF's wrapper on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install cmake ninja
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Restore dependencies and tools from the cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the pinned development tools
        run: cargo xtask setup
      - name: Run every check
        run: cargo xtask ci
      - name: Assemble the app and sign it ad hoc on macOS
        if: runner.os == 'macOS'
        run: |
          cargo xtask bundle
          codesign --verify --deep --strict target/debug/Cox.app
